<script>
// =============================================================
// FONT 7x7 (bit 7 = leftmost of 7px, bit 0 = spacing)
// =============================================================
window.FONT7={
  'H':[0x82,0x82,0x82,0xFE,0x82,0x82,0x82],
  'A':[0x7C,0x82,0x82,0xFE,0x82,0x82,0x82],
  'L':[0x80,0x80,0x80,0x80,0x80,0x80,0xFE],
  'O':[0x7C,0x82,0x82,0x82,0x82,0x82,0x7C],
  ' ':[0,0,0,0,0,0,0],
  'I':[0xFE,0x38,0x38,0x38,0x38,0x38,0xFE],
  'N':[0x82,0xC2,0xA2,0x92,0x8A,0x86,0x82],
  'D':[0x7E,0x82,0x82,0x82,0x82,0x82,0x7E],
  'S':[0x7F,0x80,0x80,0x7C,0x02,0x02,0xFE],

  '!':[0x20,0x20,0x20,0x20,0x20,0x00,0x20]
};
// Build bitmap "HALO INI DANIS " (15 chars × 8 px = 120 cols × 7 rows)
window.MSG_TEXT="HALO INI DANIS ";
window.MSG_COLS=window.MSG_TEXT.length*8;
window.MSG_BITMAP=(function(){
  var bmp=[];
  for(var r=0;r<7;r++){
    bmp[r]=[];
    for(var c=0;c<window.MSG_COLS;c++){
      var ci=Math.floor(c/8), cc=c%8;
      bmp[r][c]= (cc===7)?0:((window.FONT7[window.MSG_TEXT[ci]][r]>>(7-cc))&1);
    }
  }
  return bmp;
})();

// =============================================================
// PROGRAM BUILDER
// =============================================================
function makeProgBuilder(){
  var p=[]; var labels={}; var patches=[];
  function emit(hi,lo,data,tag,dest){ p.push([hi|0,lo|0,(data|0)&255,(tag|0)&255,(dest|0)&255]); return p.length-1; }
  function lbl(n){ labels[n]=p.length; }
  function jmpTo(n){ var i=emit(0x00,0x10,0,0,0); patches.push([i,4,n]); return i; }
  function jzTo(tag,n){ var i=emit(0x00,0x14,0,tag,0); patches.push([i,4,n]); return i; }
  function jnzTo(tag,n){ var i=emit(0x00,0x15,0,tag,0); patches.push([i,4,n]); return i; }
  function jltTo(n){ var i=emit(0x00,0x16,0,0,0); patches.push([i,4,n]); return i; }
  function jeqTo(n){ var i=emit(0x00,0x18,0,0,0); patches.push([i,4,n]); return i; }
  function jneTo(n){ var i=emit(0x00,0x19,0,0,0); patches.push([i,4,n]); return i; }
  function finish(){
    for(var i=0;i<patches.length;i++){
      var pi=patches[i][0], off=patches[i][1], tgt=labels[patches[i][2]];
      p[pi][off]=tgt;
    }
    return p;
  }
  return {
    SET:function(d,t){return emit(0x00,0x01,d,0,t);},
    MOV:function(s,t){return emit(0x00,0x02,0,s,t);},
    ADD:function(d,tg,t){return emit(0x00,0x04,d,tg,t);},
    SUB:function(d,tg,t){return emit(0x00,0x05,d,tg,t);},
    AND:function(d,tg,t){return emit(0x00,0x08,d,tg,t);},
    OR:function(d,tg,t){return emit(0x00,0x09,d,tg,t);},
    XOR:function(d,tg,t){return emit(0x00,0x0A,d,tg,t);},
    NOT:function(s,t){return emit(0x00,0x0B,0,s,t);},
    INC:function(s,t){return emit(0x00,0x0C,0,s,t);},
    DEC:function(s,t){return emit(0x00,0x0D,0,s,t);},
    JMP:jmpTo, JZ:jzTo, JNZ:jnzTo, JLT:jltTo, JEQ:jeqTo, JNE:jneTo,
    CLR:function(t){return emit(0x00,0x11,0,0,t);},
    DELAY:function(d){return emit(0x00,0x12,d,0,0);},
    SCRCLR:function(){return emit(0x00,0x13,0,0,0);},
    CMP:function(d,tg){return emit(0x00,0x20,d,tg,0);},
    SHL:function(s,t){return emit(0x00,0x21,0,s,t);},
    SHR:function(s,t){return emit(0x00,0x22,0,s,t);},
    HALT:function(){return emit(0x00,0x23,0,0,0);},
    RND:function(t){return emit(0x00,0x2A,0,0,t);},
    JOY:function(t){return emit(0x00,0x2C,0,0,t);},
    BYTE:function(d,tg){return emit(0x00,0x2F,d,tg,0);},
    TIME:function(t){return emit(0x00,0x30,0,0,t);},
    label:lbl, finish:finish, emit:emit
  };
}

// Demo program: just runs forever doing NOPs (the display scrolls from hardware)
function buildIdle(){
  var B=makeProgBuilder();
  B.label("LOOP");
  B.DELAY(1);
  B.JMP("LOOP");
  return B.finish();
}
function buildCounter(){
  var B=makeProgBuilder();
  var N=210;
  B.SET(0,N);
  B.label("LOOP");
  B.INC(N,N);
  B.DELAY(1);
  B.JMP("LOOP");
  return B.finish();
}
function buildNoise(){
  var B=makeProgBuilder();
  B.label("LOOP");
  B.DELAY(1);
  B.JMP("LOOP");
  return B.finish();
}

window.BUILTIN_PROJECTS={version:130,projects:[
  {id:"scroll", name:"HALO INI DANIS",  description:"Scrolling message (hardware)", program: buildIdle()},
  {id:"counter",name:"COUNTER",         description:"Simple counting CPU",          program: buildCounter()},
  {id:"noise",  name:"IDLE",            description:"NOP loop",                     program: buildNoise()}
]};
</script>

<script>
(function(){"use strict";

MNEMONICS[OP_XOR]="XOR";MNEMONICS[OP_NOT]="NOT";MNEMONICS[OP_INC]="INC";MNEMONICS[OP_DEC]="DEC";MNEMONICS[OP_JMP]="JMP";
MNEMONICS[OP_CLR]="CLR";MNEMONICS[OP_DELAY]="DELAY";MNEMONICS[OP_SCRCLR]="SCRCLR";MNEMONICS[OP_JZ]="JZ";
MNEMONICS[OP_JNZ]="JNZ";MNEMONICS[OP_JLT]="JLT";MNEMONICS[OP_JGT]="JGT";MNEMONICS[OP_JEQ]="JEQ";MNEMONICS[OP_JNE]="JNE";

var gates=[],sws=[],leds=[],latches=[],wires=[],sectionsData=[],frame43=null;
var vp,lW_on,lW_off,lG,lL,lU,lS;
var K0={v:0,x:0,y:0,virtual:true},K1={v:1,x:0,y:0,virtual:true};
var groupStack=[],GAPX=4,GAPY=4,jseed=7,core={};

function jr(){jseed=(jseed*1103515245+12345)&0x7fffffff;return jseed/0x7fffffff;}
function reset(){while(svg.firstChild)svg.removeChild(svg.firstChild);
gates=[];sws=[];leds=[];latches=[];wires=[];sectionsData=[];frame43=null;jseed=7;core={};
groupStack=[{x:20,y:80,rowH:0,maxW:60000,maxXUsed:0,maxYUsed:0,gStart:0,sStart:0,lStart:0,ltStart:0}];
vp=E("g",{});svg.appendChild(vp);lS=E("g",{});
lW_off=E("g",{});lW_on=E("g",{});
lG=E("g",{});lL=E("g",{});lU=E("g",{});
vp.appendChild(lW_off);vp.appendChild(lW_on);
vp.appendChild(lS);vp.appendChild(lG);vp.appendChild(lL);vp.appendChild(lU);}
function curFrame(){return groupStack[groupStack.length-1];}
function framePlaceIn(f,w,h){if(f.x>0&&f.x+w>f.maxW){f.x=0;f.y+=f.rowH+GAPY;f.rowH=0;}
var p={x:f.x,y:f.y};f.x+=w+GAPX;if(h>f.rowH)f.rowH=h;if(f.x-GAPX>f.maxXUsed)f.maxXUsed=f.x-GAPX;
var yU=f.y+h;if(yU>f.maxYUsed)f.maxYUsed=yU;return p;}
function place(w,h){return framePlaceIn(curFrame(),w,h);}
function beginGroup(mw){groupStack.push({x:0,y:0,rowH:0,maxW:mw||200,maxXUsed:0,maxYUsed:0,gStart:gates.length,sStart:sws.length,lStart:leds.length,ltStart:latches.length});}
function endGroup(){var f=groupStack.pop();if(!f)return;var w=f.maxXUsed||10,h=f.maxYUsed||10;
var pos=framePlaceIn(curFrame(),w,h);var dx=pos.x,dy=pos.y,i;
for(i=f.gStart;i<gates.length;i++){var g=gates[i];g.px+=dx;g.py+=dy;g.o.x+=dx;g.o.y+=dy;}
for(i=f.sStart;i<sws.length;i++){var s=sws[i];s.px+=dx;s.py+=dy;s.o.x+=dx;s.o.y+=dy;}
for(i=f.lStart;i<leds.length;i++){var l=leds[i];l.px+=dx;l.py+=dy;}
for(i=f.ltStart;i<latches.length;i++){var lt=latches[i];lt.px+=dx;lt.py+=dy;}}
function forceNewRow(){var f=groupStack[0];if(!f)return;f.x=0;f.y+=f.rowH+30;f.rowH=0;}
function sectionColor(t){
if(/^INPUT/.test(t)) return "#4a9eff";
if(/^(STORAGE|GPU|SCR|RAM|FONT)/.test(t)) return "#a060ff";
if(/^(CTRL|MUX|FETCH|PROG)/.test(t)) return "#ffb020";
if(/^ALU/.test(t)) return "#39d353";
if(/^(OUTPUT|SCREEN|HALT|JOY|RND|HW)/.test(t)) return "#ff4d4d";
return "#666";}
function section(title,mw,fn){_curSect=title;
var g0=gates.length,s0=sws.length,l0=leds.length,lt0=latches.length;
beginGroup(mw);fn();endGroup();
var mnx=Infinity,mny=Infinity,mxx=-Infinity,mxy=-Infinity;
function ext(x1,y1,x2,y2){if(x1<mnx)mnx=x1;if(y1<mny)mny=y1;if(x2>mxx)mxx=x2;if(y2>mxy)mxy=y2;}
for(var i=g0;i<gates.length;i++){var g=gates[i];ext(g.px-6,g.py-2,g.px+41,g.py+32);}
for(var i=lt0;i<latches.length;i++){var l=latches[i];ext(l.px-4,l.py-2,l.px+48,l.py+40);}
for(var i=s0;i<sws.length;i++){var s=sws[i];ext(s.px-2,s.py-2,s.px+42,s.py+48);}
for(var i=l0;i<leds.length;i++){var l=leds[i];var r=(l.sz||6)*0.7+2;ext(l.px-r,l.py-r,l.px+r,l.py+r);}
if(isFinite(mnx)){var pad=12;
sectionsData.push({x:mnx-pad,y:mny-pad-24,w:(mxx-mnx)+2*pad,h:(mxy-mny)+2*pad+24,title:title,color:sectionColor(title),g0:g0,g1:gates.length,s0:s0,s1:sws.length,l0:l0,l1:leds.length,lt0:lt0,lt1:latches.length});}
_curSect="";}
function N(v,d){return{v:v|0,d:d|0};}
function mkGate(t,ins){var d=0;for(var i=0;i<ins.length;i++)d=Math.max(d,(ins[i]&&ins[i].d)||0);d=d+1;
var p=place(44,36);var jy=Math.floor(jr()*5);
var g={t:t,i:ins,o:N(0,d),px:p.x,py:p.y+jy,sect:_curSect};g.o.x=g.px+34;g.o.y=g.py+15;

gates.push(g);return g;}

function OR(a,b){return mkGate("OR",[a,b]).o;}
function NOT(a){return mkGate("NOT",[a]).o;}

var w={t:"LATX",i:[K0,K0],o:N(init,1),px:p.x,py:p.y,prev:init,prevEn:0,sect:_curSect};
w.o.x=p.x+46;w.o.y=p.y+20;latches.push(w);return w;}

function addN(a,b,cin,n){var c=cin||K0,s=[];for(var i=0;i<n;i++){var ab=XOR(a[i],b[i]);var sum=XOR(ab,c);var g1=AND(a[i],b[i]);var g2=AND(ab,c);c=OR(g1,g2);s.push(sum);}return {sum:s,carry:c};}

function eqN(bits,val,n){var acc=null;for(var i=0;i<n;i++){var b=(val>>i)&1;var s=b?bits[i]:NOT(bits[i]);acc=(acc===null)?s:AND(acc,s);}return acc;}

      for(i=0;i<RAM_SIZE;i++){var t=AND(destDec[i],core.RAM[i][b].o);acc=(acc===null)?t:OR(acc,t);}
      srcC.push(acc);endGroup();}

  section("ALU · MOV",900,function(){opResult[OP_MOV]=srcB.slice();});
  section("ALU · ADD",1600,function(){opResult[OP_ADD]=add8(srcB,srcC);});
  section("ALU · SUB",1600,function(){opResult[OP_SUB]=sub8(srcB,srcC);});
  section("ALU · AND",800,function(){var r=[];for(b=0;b<8;b++)r.push(AND(srcB[b],srcC[b]));opResult[OP_AND]=r;});
  section("ALU · OR",800,function(){var r=[];for(b=0;b<8;b++)r.push(OR(srcB[b],srcC[b]));opResult[OP_OR]=r;});
  section("ALU · XOR",800,function(){var r=[];for(b=0;b<8;b++)r.push(XOR(srcB[b],srcC[b]));opResult[OP_XOR]=r;});
  section("ALU · NOT",800,function(){var r=[];for(b=0;b<8;b++)r.push(NOT(srcB[b]));opResult[OP_NOT]=r;});
  section("ALU · INC",1600,function(){opResult[OP_INC]=add8(srcB,[K1,K0,K0,K0,K0,K0,K0,K0]);});
  section("ALU · DEC",1600,function(){opResult[OP_DEC]=sub8(srcB,[K1,K0,K0,K0,K0,K0,K0,K0]);});
  section("ALU · SHL",800,function(){var r=[K0];for(b=0;b<7;b++)r.push(srcB[b]);opResult[OP_SHL]=r;});

  forceNewRow();
  // Shift operation: each latch gets value from left neighbor; rightmost gets newCol
  section("GPU · SHIFT LOGIC",TEXT_ROWS*SCR_W*10,function(){
    for(r=0;r<TEXT_ROWS;r++){
      beginGroup(SCR_W*8);
      for(c=0;c<SCR_W;c++){
        beginGroup(8);
        var src = (c===SCR_W-1) ? core.newCol[r] : core.scrLatch[r][c+1].o;
        // New value: shift LEFT visually = pixel at (x,y) becomes pixel at (x-1,y)
        // So latch[r][c] new = latch[r][c+1] old
        setLat(core.scrLatch[r][c], src, core.shiftPulse);
        endGroup();
      }
      endGroup();
    }
  });
  forceNewRow();
  // Now build SCREEN section: LEDs, each wired from scrLatch[r][c]
  section(SCR_TITLE, SCR_W*(LED_SZ+GAPX)+GAPX, function(){
    for(var row=0;row<SCR_H;row++){
      beginGroup(SCR_W*(LED_SZ+GAPX)+GAPX);
      core.screenLeds=core.screenLeds||[];
      core.screenLeds.push([]);
      for(var col=0;col<SCR_W;col++){
        var sig;
        if(row<TEXT_ROWS && core.scrLatch[row] && core.scrLatch[row][col]){
          sig = core.scrLatch[row][col].o;
        } else {
          sig = K0;
        }
        core.screenLeds[row].push(pixelLed(sig, LED_SZ));
      }
      endGroup();
    }
  });
  // Hide wires in SCREEN (visual clutter)
  var _HIDE=/^(INPUT|OUTPUT|SCREEN|PROG · ROM|GPU · SCR SHIFT)/;
  for(var wi=0;wi<wires.length;wi++){
    var ww=wires[wi];
    var sSect=ww.s?ww.s.sect:null;
    var dSect=ww.l?ww.l.sect:(ww.g?ww.g.sect:null);
    if((sSect&&_HIDE.test(sSect))||(dSect&&_HIDE.test(dSect))) ww.hide=true;
  }
}

// ============================================================
// LOAD PROGRAM
// ============================================================
var NOOP5=[0,0,0,0,0];
function clearMemory(){
  for(var q=0;q<latches.length;q++) latchReset(latches[q],0);
  for(var i=0;i<7;i++) if(core.frameBits&&core.frameBits[i]) latchReset(core.frameBits[i],0);
  for(var i=0;i<3;i++) if(core.divBits&&core.divBits[i]) latchReset(core.divBits[i],0);
}
function loadProgram(proj){
  clearMemory();
  var prog=proj.program||[];
  for(var i=0;i<PROG_SLOTS;i++){
    var ins=(i<prog.length)?prog[i]:NOOP5;
    for(var bi=0;bi<5;bi++){
      var byteVal=(ins[bi]|0)&0xFF;
      if(core.romInst[i]&&core.romInst[i][bi]){
        for(var b=0;b<8;b++) latchReset(core.romInst[i][bi][b],(byteVal>>b)&1);
      }
    }
  }
}
function initProj(){
  var box=document.getElementById("projSel");var dd=document.getElementById("projDropdown");
  var P=window.BUILTIN_PROJECTS;if(!P||!P.projects||!P.projects.length){box.style.display="none";return;}
  var list=P.projects;while(dd.firstChild)dd.removeChild(dd.firstChild);
  for(var i=0;i<list.length;i++){var o=document.createElement("option");o.value=list[i].id;o.textContent=list[i].name;dd.appendChild(o);}
  dd.onchange=function(){for(var j=0;j<list.length;j++){if(list[j].id===dd.value){
    loadProgram(list[j]);updateHUD();return;}}};
  box.style.display="flex";loadProgram(list[0]);
}

// ============================================================
// ROUTE WIRES
// ============================================================
function routeWires(){var STEP=2,buckets={},list=[],i,w;
for(i=0;i<wires.length;i++){w=wires[i];delete w.mx;if(w.hide)continue;if(w.s.x===undefined)continue;
if(w.l){w.ex=w.l.px-(w.l.sz||22)*0.5-1;w.ey=w.l.py;}
else if(w.g&&w.g.px!==undefined){w.ex=w.g.px-6;w.ey=w.g.py+w.py;}else{continue;}
if(Math.abs(w.s.y-w.ey)<3)continue;list.push(w);}
list.sort(function(a,b){return Math.abs(b.ey-b.s.y)-Math.abs(a.ey-a.s.y);});
for(i=0;i<list.length;i++){w=list[i];var y1=Math.min(w.s.y,w.ey)-1,y2=Math.max(w.s.y,w.ey)+1;
var ideal=w.s.x+(w.ex-w.s.x)/2,base=Math.round(ideal/STEP),pick=null;
for(var d=0;d<400&&pick===null;d++){for(var sg=(d===0?1:-1);sg<=1&&pick===null;sg+=2){
var key=base+sg*d,arr=buckets[key],ok=true;
if(arr)for(var m=0;m<arr.length;m++){var o=arr[m];if(o.n!==w.s&&o.a<y2&&o.b>y1){ok=false;break;}}
if(ok)pick=key;}}
if(pick===null)pick=base;(buckets[pick]||(buckets[pick]=[])).push({a:y1,b:y2,n:w.s});w.mx=pick*STEP;}}

// ============================================================
// RELAYOUT
// ============================================================
function relayout(){
var M=80,GX=30,GY=30;
var byTitle={};var i,k;
for(i=0;i<sectionsData.length;i++) byTitle[sectionsData[i].title]=sectionsData[i];
function moveSection(s,nx,ny){var dx=nx-s.x,dy=ny-s.y;
for(k=s.g0;k<s.g1;k++){var g=gates[k];g.px+=dx;g.py+=dy;g.o.x+=dx;g.o.y+=dy;}
for(k=s.s0;k<s.s1;k++){var q=sws[k];q.px+=dx;q.py+=dy;q.o.x+=dx;q.o.y+=dy;}
for(k=s.l0;k<s.l1;k++){var l=leds[k];l.px+=dx;l.py+=dy;}
for(k=s.lt0;k<s.lt1;k++){var lt=latches[k];lt.px+=dx;lt.py+=dy;}
s.x=nx;s.y=ny;}
var inputTitles=["INPUT · PC_HI","INPUT · PC_LO","INPUT · CLK"];
var x=M,y=M,inW=0;
for(i=0;i<inputTitles.length;i++){var sc=byTitle[inputTitles[i]];if(!sc)continue;
moveSection(sc,x,y);y+=sc.h+GY;if(sc.w>inW)inW=sc.w;}
var scrX=M+inW+GX*2;
var scrY=M;
var screenSec=byTitle[SCR_TITLE];
var rightH=0;
if(screenSec){moveSection(screenSec,scrX,scrY);rightH+=screenSec.h;}
var logicTop=Math.max(y, M+rightH)+GY*3;
var logicX=M, logicY=logicTop, rowH=0;
var maxW=Math.max(3000,window.innerWidth*4);
var used={};
for(i=0;i<inputTitles.length;i++)used[inputTitles[i]]=1;
used[SCR_TITLE]=1;
var logics=[];
for(i=0;i<sectionsData.length;i++){if(!used[sectionsData[i].title])logics.push(sectionsData[i]);}
logics.sort(function(a,b){return b.h-a.h;});
for(i=0;i<logics.length;i++){var s2=logics[i];
if(logicX+s2.w>maxW&&logicX>M){logicX=M;logicY+=rowH+GY;rowH=0;}
moveSection(s2,logicX,logicY);
logicX+=s2.w+GX;if(s2.h>rowH)rowH=s2.h;}
var mnx=Infinity,mny=Infinity,mxx=-Infinity,mxy=-Infinity;
for(i=0;i<sectionsData.length;i++){var ss=sectionsData[i];
if(ss.x<mnx)mnx=ss.x;if(ss.y<mny)mny=ss.y;
if(ss.x+ss.w>mxx)mxx=ss.x+ss.w;if(ss.y+ss.h>mxy)mxy=ss.y+ss.h;}
return {x:mnx,y:mny,w:mxx-mnx,h:mxy-mny};}

// ============================================================
// FIT / ZOOM
// ============================================================
function fitAll(){if(!frame43)return;var r=svg.getBoundingClientRect();
var k=Math.min(r.width/frame43.w,r.height/frame43.h)*0.95;if(k<0.0005)k=0.0005;
view.k=k;view.x=(r.width-frame43.w*k)/2-frame43.x*k;view.y=(r.height-frame43.h*k)/2-frame43.y*k;applyView();}
function fitScreen(){var r=svg.getBoundingClientRect();
var x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity,found=false;
for(var i=0;i<sectionsData.length;i++){var s=sectionsData[i];
if(s.title===SCR_TITLE){found=true;
if(s.x<x1)x1=s.x;if(s.y<y1)y1=s.y;
if(s.x+s.w>x2)x2=s.x+s.w;if(s.y+s.h>y2)y2=s.y+s.h;}}
if(!found){fitAll();return;}
var w=x2-x1,h=y2-y1,cx=(x1+x2)/2,cy=(y1+y2)/2;
var k=Math.min(r.width/(w+120),r.height/(h+120))*0.92;
if(k<0.05)k=0.05;if(k>2.0)k=2.0;
view.k=k;view.x=r.width/2-cx*k;view.y=r.height/2-cy*k;applyView();}
function updateGateCount(){var total=gates.length+sws.length+leds.length;
document.getElementById("gcount").textContent="· "+total.toLocaleString()+" gates · "+latches.length.toLocaleString()+" FFs";}

// ============================================================
// HUD
// ============================================================
var hudPTR=document.getElementById("hudPTR"),hudTMR=document.getElementById("hudTMR"),hudIR=document.getElementById("hudIR"),hudMN=document.getElementById("hudMN");
function readPC(){var v=0;if(!core.pc)return 0;for(var b=0;b<8;b++)if(core.pc[b]&&core.pc[b].o.v)v|=(1<<b);return v;}
function readIR(){var hi=0,lo=0;
if(core.opHi)for(var b=0;b<8;b++)if(core.opHi[b]&&core.opHi[b].v)hi|=(1<<b);
if(core.opLo)for(var b=0;b<8;b++)if(core.opLo[b]&&core.opLo[b].v)lo|=(1<<b);
return (hi<<8)|lo;}
function updateHUD(){
  hudPTR.textContent=readPC();
  hudTMR.textContent=core.frame?core.frame.v:0;
  var ir=readIR();var hex=ir.toString(16).toUpperCase();while(hex.length<4)hex="0"+hex;
  hudIR.textContent=hex;hudMN.textContent=MNEMONICS[ir]||"----";
}

// ============================================================
// INIT
// ============================================================
function loadProject(){try{
reset();
buildFrontend();
buildProgramRom();
buildFetch();
buildRam();
buildCpu();
buildScreen();
frame43=relayout();
routeWires();
initProj();
simulate();
updateHUD();updateGateCount();
fitScreen();renderFrame();
}catch(e){showErr((e&&e.message)||String(e));console.error(e);if(e&&e.stack)console.error(e.stack);}}
var view={x:0,y:0,k:1};var MIN_K=0.0002,MAX_K=30;
function applyView(){if(vp)vp.setAttribute("transform","translate("+view.x+","+view.y+") scale("+view.k+")");}
function setZoomAt(nk,cx,cy){nk=Math.min(MAX_K,Math.max(MIN_K,nk));var s=nk/view.k;
view.x=cx-(cx-view.x)*s;view.y=cy-(cy-view.y)*s;view.k=nk;applyView();}
function zoomC(f){var r=svg.getBoundingClientRect();setZoomAt(view.k*f,r.width/2,r.height/2);}
svg.addEventListener("wheel",function(e){e.preventDefault();var r=svg.getBoundingClientRect();
setZoomAt(view.k*(e.deltaY<0?1.12:1/1.12),e.clientX-r.left,e.clientY-r.top);},{passive:false});
var ptrs={},panS=null,pinchS=null,mode=null;
svg.addEventListener("pointerdown",function(e){
if(e.target&&e.target.classList&&e.target.classList.contains("swhit"))return;
if(e.target&&e.target.parentNode&&e.target.parentNode.classList&&e.target.parentNode.classList.contains("swhit"))return;
if(e.button!==undefined&&e.button!==0&&e.pointerType==="mouse")return;
ptrs[e.pointerId]={x:e.clientX,y:e.clientY};try{svg.setPointerCapture(e.pointerId);}catch(err){}
var ids=Object.keys(ptrs);
if(ids.length===1){mode="pan";panS={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y,moved:false};svg.classList.add("drag");}
else if(ids.length===2){mode="pinch";var p0=ptrs[ids[0]],p1=ptrs[ids[1]];
pinchS={d:Math.hypot(p0.x-p1.x,p0.y-p1.y),cx:(p0.x+p1.x)/2,cy:(p0.y+p1.y)/2,k:view.k,x:view.x,y:view.y};panS=null;}});
svg.addEventListener("pointermove",function(e){if(!ptrs[e.pointerId])return;
ptrs[e.pointerId].x=e.clientX;ptrs[e.pointerId].y=e.clientY;
if(mode==="pinch"){var ids=Object.keys(ptrs);if(ids.length<2)return;
var p0=ptrs[ids[0]],p1=ptrs[ids[1]];var d=Math.hypot(p0.x-p1.x,p0.y-p1.y);var cx=(p0.x+p1.x)/2,cy=(p0.y+p1.y)/2;
var r=svg.getBoundingClientRect();var f=d/pinchS.d;var nk=Math.min(MAX_K,Math.max(MIN_K,pinchS.k*f));var s=nk/pinchS.k;
var mx=pinchS.cx-r.left,my=pinchS.cy-r.top;var nmx=cx-r.left,nmy=cy-r.top;
view.x=nmx-(mx-pinchS.x)*s;view.y=nmy-(my-pinchS.y)*s;view.k=nk;applyView();}
else if(mode==="pan"&&panS){var dx=e.clientX-panS.x,dy=e.clientY-panS.y;
if(Math.abs(dx)>3||Math.abs(dy)>3)panS.moved=true;
if(panS.moved){view.x=panS.ox+dx;view.y=panS.oy+dy;applyView();}}});
function endPtr(e){delete ptrs[e.pointerId];var ids=Object.keys(ptrs);
if(ids.length===0){mode=null;panS=null;pinchS=null;svg.classList.remove("drag");}
else if(ids.length===1){mode="pan";var id=ids[0];panS={x:ptrs[id].x,y:ptrs[id].y,ox:view.x,oy:view.y,moved:false};pinchS=null;}}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("pointerleave",function(e){if(ptrs[e.pointerId])endPtr(e);});
svg.addEventListener("dblclick",function(){fitScreen();});
document.getElementById("zoomIn").addEventListener("click",function(){zoomC(1.3);});
document.getElementById("zoomOut").addEventListener("click",function(){zoomC(1/1.3);});
document.getElementById("zoomReset").addEventListener("click",function(){fitAll();});

loadProject();

// CPU loop — 8 CLK pulses per 30ms (~266 IPS), enough to settle 7-bit decoders
setInterval(function(){
  try{
    if(core.CLKsw){
      for(var c=0;c<8;c++){
        core.CLKsw.v=1;simulate();
        core.CLKsw.v=0;simulate();
      }
    } else {
      for(var c=0;c<4;c++) simulate();
    }
    updateHUD();
  }catch(e){showErr((e&&e.message)||String(e));}
},30);

var lastR=0;
requestAnimationFrame(function loop(t){requestAnimationFrame(loop);if(t-lastR<33)return;lastR=t;
try{renderFrame();}catch(e){showErr((e&&e.message)||String(e));}});
})();
</script>
</body></html>
