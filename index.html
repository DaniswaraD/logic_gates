var K0={v:0,x:0,y:0,virtual:true},K1={v:1,x:0,y:0,virtual:true};
var groupStack=[],GAPX=4,GAPY=4,jseed=7,core={};
var gInvertState=0, gCLKCount=0;
function jr(){jseed=(jseed*1103515245+12345)&0x7fffffff;return jseed/0x7fffffff;}

function reset(){
while(svg.firstChild)svg.removeChild(svg.firstChild);
gates=[];sws=[];leds=[];latches=[];wires=[];sectionsData=[];frame43=null;jseed=7;core={};
groupStack=[{x:20,y:80,rowH:0,maxW:60000,maxXUsed:0,maxYUsed:0,gStart:0,sStart:0,lStart:0,ltStart:0}];
vp=E("g",{});svg.appendChild(vp);
lW_off=E("path",{fill:"none",stroke:"#cfcfcf","stroke-width":1,"stroke-linejoin":"round"});
lW_on=E("path",{fill:"none",stroke:"#111","stroke-width":1.5,"stroke-linejoin":"round"});
lS=E("g",{});
lG=E("g",{});lL=E("g",{});lU=E("g",{});
vp.appendChild(lW_off);vp.appendChild(lW_on);
vp.appendChild(lS);vp.appendChild(lG);vp.appendChild(lL);vp.appendChild(lU);
}
function curFrame(){return groupStack[groupStack.length-1];}
function framePlaceIn(f,w,h){
if(f.x>0&&f.x+w>f.maxW){f.x=0;f.y+=f.rowH+GAPY;f.rowH=0;}
var p={x:f.x,y:f.y};f.x+=w+GAPX;if(h>f.rowH)f.rowH=h;
if(f.x-GAPX>f.maxXUsed)f.maxXUsed=f.x-GAPX;
var yU=f.y+h;if(yU>f.maxYUsed)f.maxYUsed=yU;return p;
}
function place(w,h){return framePlaceIn(curFrame(),w,h);}
function beginGroup(mw){groupStack.push({x:0,y:0,rowH:0,maxW:mw||200,maxXUsed:0,maxYUsed:0,gStart:gates.length,sStart:sws.length,lStart:leds.length,ltStart:latches.length});}
function endGroup(){
var f=groupStack.pop();if(!f)return;
var w=f.maxXUsed||10,h=f.maxYUsed||10;
var pos=framePlaceIn(curFrame(),w,h);var dx=pos.x,dy=pos.y,i;
for(i=f.gStart;i<gates.length;i++){var g=gates[i];g.px+=dx;g.py+=dy;g.o.x+=dx;g.o.y+=dy;}
for(i=f.sStart;i<sws.length;i++){var s=sws[i];s.px+=dx;s.py+=dy;s.o.x+=dx;s.o.y+=dy;}
for(i=f.lStart;i<leds.length;i++){var l=leds[i];l.px+=dx;l.py+=dy;if(l.ph){l.ph.x=l.px-2;l.ph.y=l.py;}}
for(i=f.ltStart;i<latches.length;i++){var lt=latches[i];lt.px+=dx;lt.py+=dy;}
}
function forceNewRow(){var f=groupStack[0];if(!f)return;f.x=0;f.y+=f.rowH+30;f.rowH=0;}
function section(title,mw,fn){
var g0=gates.length,s0=sws.length,l0=leds.length,lt0=latches.length;
beginGroup(mw);fn();endGroup();
var mnx=Infinity,mny=Infinity,mxx=-Infinity,mxy=-Infinity;
function ext(x1,y1,x2,y2){if(x1<mnx)mnx=x1;if(y1<mny)mny=y1;if(x2>mxx)mxx=x2;if(y2>mxy)mxy=y2;}
for(var i=g0;i<gates.length;i++){var g=gates[i];ext(g.px-6,g.py-2,g.px+41,g.py+32);}
for(var i=lt0;i<latches.length;i++){var l=latches[i];ext(l.px-4,l.py-2,l.px+48,l.py+40);}
for(var i=s0;i<sws.length;i++){var s=sws[i];ext(s.px-2,s.py-2,s.px+52,s.py+59);}
for(var i=l0;i<leds.length;i++){var l=leds[i];var r=l.sz?l.sz*0.5:10;ext(l.px-r-2,l.py-r-2,l.px+r+2,l.py+r+2);}
if(!isFinite(mnx))return;var pad=8;
sectionsData.push({x:mnx-pad,y:mny-pad-18,w:(mxx-mnx)+2*pad,h:(mxy-mny)+2*pad+18,title:title,g0:g0,g1:gates.length,s0:s0,s1:sws.length,l0:l0,l1:leds.length,lt0:lt0,lt1:latches.length});
}
function N(v,d){return{v:v|0,d:d|0};}
function mkGate(t,ins){
var d=0;for(var i=0;i<ins.length;i++)d=Math.max(d,(ins[i]&&ins[i].d)||0);d=d+1;
var p=place(44,36);var jy=Math.floor(jr()*7);
var g={t:t,i:ins,o:N(0,d),px:p.x,py:p.y+jy};g.o.x=g.px+34;g.o.y=g.py+15;
for(var i=0;i<ins.length;i++){var iy=ins.length===1?15:(i===0?10:20);if(ins[i]&&ins[i].x!==undefined&&!ins[i].virtual)wires.push({s:ins[i],g:g,py:iy});}
gates.push(g);return g;
}
function AND(a,b){return mkGate("AND",[a,b]).o;}
function OR(a,b){return mkGate("OR",[a,b]).o;}
function NOT(a){return mkGate("NOT",[a]).o;}
function XOR(a,b){return mkGate("XOR",[a,b]).o;}
function LAT(init){
init=init|0;
var p=place(46,40);
var wrapper={t:"LATX",i:[K0,K0],o:N(init,1),px:p.x,py:p.y,prev:init,prevEn:0};
wrapper.o.x=p.x+46;wrapper.o.y=p.y+20;
latches.push(wrapper);
return wrapper;
}
function setLat(wrapper,d,en){
wrapper.i[0]=d;wrapper.i[1]=en;
if(d&&d.x!==undefined&&!d.virtual)wires.push({s:d,g:wrapper,py:15});

section("OUTPUT · WRITE EN",20000,function(){
var runOk=AND(core.effRunEdge,core.nDelay);
var wrEnable=OR(core.WRo,core.RUNQo);
var wrPulse=AND(runOk,wrEnable);
var nClr=NOT(core.clrEdge);

var scrollPulse=AND(runOk,opDec[OP_SCROLL]);
var storerAct=AND(runOk,opDec[OP_STORER]);
var noWrite=K0;
noWrite=OR(noWrite,opDec[OP_NOP]);noWrite=OR(noWrite,opDec[OP_JMP]);
noWrite=OR(noWrite,opDec[OP_JZ]);noWrite=OR(noWrite,opDec[OP_JNZ]);
noWrite=OR(noWrite,opDec[OP_DELAY]);noWrite=OR(noWrite,opDec[OP_SCRCLR]);
noWrite=OR(noWrite,opDec[OP_SCROLL]);noWrite=OR(noWrite,opDec[OP_SPX]);
noWrite=OR(noWrite,opDec[OP_SPY]);noWrite=OR(noWrite,opDec[OP_SPXP]);
noWrite=OR(noWrite,opDec[OP_SPXM]);noWrite=OR(noWrite,opDec[OP_SPYP]);
noWrite=OR(noWrite,opDec[OP_SPYM]);noWrite=OR(noWrite,opDec[OP_SPSHOW]);
noWrite=OR(noWrite,opDec[OP_SPHIDE]);noWrite=OR(noWrite,opDec[OP_HOME]);
noWrite=OR(noWrite,opDec[OP_CUR]);noWrite=OR(noWrite,opDec[OP_CHR]);
noWrite=OR(noWrite,opDec[OP_NL]);noWrite=OR(noWrite,opDec[OP_CLRLN]);
noWrite=OR(noWrite,opDec[OP_SCLR]);noWrite=OR(noWrite,opDec[OP_FILL]);
noWrite=OR(noWrite,opDec[OP_HALT]);noWrite=OR(noWrite,opDec[OP_FONT]);
noWrite=OR(noWrite,opDec[OP_STOREW]);noWrite=OR(noWrite,opDec[OP_POKER]);
noWrite=OR(noWrite,opDec[OP_SEED]);
var doWrite=NOT(noWrite);

var cellBit0=cCol[0].o;
var cellBit1=cCol[1].o;
var cellBit2=OR(AND(nbig,cCol[2].o),AND(big,cRow[0].o));
var cellBit3=OR(AND(nbig,cRow[0].o),AND(big,K0));
var cellBit4=OR(AND(nbig,cRow[1].o),AND(big,K0));
var cellBits=[cellBit0,cellBit1,cellBit2,cellBit3,cellBit4];

var pokeAct=AND(runOk,opDec[OP_POKE]);
var SPACE=[K0,K0,K1,K0,K0,K0,K0,K0];

var rowMatchList=[];
for(i=0;i<DISPLAY_CELLS;i++){
var rsRow=(i/CHAR_COLS)|0;
var rs0=(rsRow&1)?cRow[0].o:NOT(cRow[0].o);
var rs1=(rsRow&2)?cRow[1].o:NOT(cRow[1].o);
rowMatchList.push(AND(rs0,rs1));
}

for(i=0;i<RAM_SIZE;i++){
beginGroup(100);
var wEn=AND(AND(wrPulse,destDec[i]),doWrite);
var pokeEn=AND(pokeAct,pokeDec[i]);
var storerEn=AND(storerAct,destDec[i]);
var inDisp=(i<DISPLAY_CELLS)?K1:K0;
var scrollEn=AND(scrollPulse,inDisp);

var chrEn=K0,clrEn=K0,sclrEn=K0,fillEn=K0;
if(i<DISPLAY_CELLS){
var chrHit=eqN(cellBits,i,5);
chrEn=AND(AND(core.effRunEdge,opDec[OP_CHR]),chrHit);
clrEn=AND(AND(core.effRunEdge,opDec[OP_CLRLN]),rowMatchList[i]);
sclrEn=AND(core.effRunEdge,opDec[OP_SCLR]);
fillEn=AND(core.effRunEdge,opDec[OP_FILL]);
}
if(i<DISPLAY_CELLS)wEn=OR(wEn,scrClrPulse);
var textEn=OR(OR(chrEn,clrEn),OR(sclrEn,fillEn));
var en=OR(OR(OR(wEn,core.clrEdge),scrollEn),pokeEn);
en=OR(en,textEn);
en=OR(en,storerEn);

for(b=0;b<8;b++){
var norm=AND(finalR[b],nClr);
var isLast=((i%CHAR_COLS)===CHAR_COLS-1)?K1:K0;
var nextBit=((i+1)<DISPLAY_CELLS)?RAM[i+1][b].o:K0;
var inRowScroll=OR(AND(isLast,core.finalData[b]),AND(NOT(isLast),nextBit));
var scrollData=OR(AND(rowMatchList[i],inRowScroll),AND(NOT(rowMatchList[i]),RAM[i][b].o));
var dB=OR(AND(scrollEn,scrollData),AND(NOT(scrollEn),norm));

var pokeBit=core.finalData[b];
var chrBit=core.finalData[b];
var clrBit=SPACE[b];
var fillBit=core.finalData[b];
var sclrBit=(i<DISPLAY_CELLS-CHAR_COLS)?RAM[i+CHAR_COLS][b].o:core.finalData[b];

var anyText=OR(OR(chrEn,clrEn),OR(sclrEn,fillEn));
var textBit=OR(OR(AND(chrEn,chrBit),AND(clrEn,clrBit)),OR(AND(sclrEn,sclrBit),AND(fillEn,fillBit)));
var withText=OR(AND(anyText,textBit),AND(NOT(anyText),dB));
var withPoke=OR(AND(pokeEn,pokeBit),AND(NOT(pokeEn),withText));
var storerBit=storRead[b];
var withStorer=OR(AND(storerEn,storerBit),AND(NOT(storerEn),withPoke));
setLat(RAM[i][b],withStorer,en);
}
endGroup();
}
});

var cellIdx=(r/CHAR_PX|0)*CHAR_COLS+(c/CHAR_PX|0);
var px=c%CHAR_PX;
var py=r%CHAR_PX;
var bit=7-px;
var acc=null;
for(var si=0;si<SUPPORTED.length;si++){
var ch=SUPPORTED[si];
var fbit=(window.FONT8[ch][py]>>bit)&1;
if(!fbit)continue;
var b0=(ch>>0)&1, b1=(ch>>1)&1, b2=(ch>>2)&1, b3=(ch>>3)&1;
var b4=(ch>>4)&1, b5=(ch>>5)&1, b6=(ch>>6)&1, b7=(ch>>7)&1;
var e0=b0?RAM[cellIdx][0].o:NOT(RAM[cellIdx][0].o);
var e1=b1?RAM[cellIdx][1].o:NOT(RAM[cellIdx][1].o);
var e2=b2?RAM[cellIdx][2].o:NOT(RAM[cellIdx][2].o);
var e3=b3?RAM[cellIdx][3].o:NOT(RAM[cellIdx][3].o);
var e4=b4?RAM[cellIdx][4].o:NOT(RAM[cellIdx][4].o);
var e5=b5?RAM[cellIdx][5].o:NOT(RAM[cellIdx][5].o);
var e6=b6?RAM[cellIdx][6].o:NOT(RAM[cellIdx][6].o);
var e7=b7?RAM[cellIdx][7].o:NOT(RAM[cellIdx][7].o);
var a1=AND(e0,e1);
var a2=AND(e2,e3);
var a3=AND(e4,e5);
var a4=AND(e6,e7);
var eq=AND(AND(a1,a2),AND(a3,a4));
acc=(acc===null)?eq:OR(acc,eq);
}
if(acc===null)acc=K0;
rewireLed(screenLeds[r][c],acc);
}
}
});

forceNewRow();
section("SCREEN · SCOL",2000,function(){
var k0=core.sxK[0],k1=core.sxK[1],k2=core.sxK[2],k3=core.sxK[3];
core.colMatch=[];
for(c=0;c<SCR_W;c++){beginGroup(150);var e0=eqN(k0,c,5),e1=eqN(k1,c,5),e2=eqN(k2,c,5),e3=eqN(k3,c,5);core.colMatch.push(OR(OR(e0,e1),OR(e2,e3)));endGroup();}
});
section("SCREEN · SROW",1200,function(){
var k0=core.syK[0],k1=core.syK[1],k2=core.syK[2],k3=core.syK[3];
core.rowMatch=[];
for(r=0;r<SCR_H;r++){beginGroup(150);var e0=eqN(k0,r,4),e1=eqN(k1,r,4),e2=eqN(k2,r,4),e3=eqN(k3,r,4);core.rowMatch.push(OR(OR(e0,e1),OR(e2,e3)));endGroup();}
});
forceNewRow();
section("SCREEN · SPRITE OVER",4000,function(){
for(r=0;r<SCR_H;r++){beginGroup(SCR_W*40);
for(c=0;c<SCR_W;c++){beginGroup(40);
var hit=AND(core.sprVis.o,AND(core.colMatch[c],core.rowMatch[r]));
var ex=screenLeds[r][c].i;
rewireLed(screenLeds[r][c],OR(ex,hit));
endGroup();}
endGroup();}
});
forceNewRow();
section("OUTPUT · RAM VIEW",RAM_SIZE*(SIZE_LED+GAPX)+GAPX,function(){
for(var br=0;br<8;br++){beginGroup(RAM_SIZE*(SIZE_LED+GAPX)+GAPX);var row=[];for(var a=0;a<RAM_SIZE;a++)row.push(ledPending("#ffb020","",SIZE_LED));ramViewRows.push(row);endGroup();}
});
for(var a=0;a<RAM_SIZE;a++)for(var bb=0;bb<8;bb++)rewireLed(ramViewRows[7-bb][a],RAM[a][bb].o);
forceNewRow();
section("OUTPUT · STORAGE VIEW",STORE_SIZE*(SIZE_LED+GAPX)+GAPX,function(){
for(var br=0;br<8;br++){beginGroup(STORE_SIZE*(SIZE_LED+GAPX)+GAPX);var row=[];for(var a=0;a<STORE_SIZE;a++)row.push(ledPending("#4a9eff","",SIZE_LED));storeViewRows.push(row);endGroup();}
});
for(var a=0;a<STORE_SIZE;a++)for(var bb=0;bb<8;bb++)rewireLed(storeViewRows[7-bb][a],core.STORE[a][bb].o);
forceNewRow();
}

var NOOP=[0x00,0x00,0x00,0x00];
function writeRamByte(arr,addr,val){if(addr<0||addr>=RAM_SIZE)return;for(var b=0;b<8;b++)latchReset(arr[addr][b],(val>>b)&1);}
function writeStoreByte(addr,val){if(addr<0||addr>=STORE_SIZE)return;for(var b=0;b<8;b++)latchReset(core.STORE[addr][b],(val>>b)&1);}

function clearMemory(){
for(var q=0;q<latches.length;q++)latchReset(latches[q],0);
}
function loadProgram(proj){
clearMemory();
var prog=proj.program||proj;
if(proj.storage){for(var k=0;k<proj.storage.length;k++){writeStoreByte(proj.storage[k][0],proj.storage[k][1]);}}
var pad=(prog||[]).slice(0,QUEUE_SLOTS);
while(pad.length<QUEUE_SLOTS)pad.push(NOOP.slice());
var addr=QUEUE_START;
for(var i=0;i<QUEUE_SLOTS;i++){
var ins=pad[i];
writeRamByte(core.RAM,addr,ins[0]&0xFF);
writeRamByte(core.RAM,addr+1,ins[1]&0xFF);
writeRamByte(core.RAM,addr+2,ins[2]&0xFF);
writeRamByte(core.RAM,addr+3,ins[3]&0xFF);
for(var b=0;b<ADDR_BITS;b++)latchReset(core.slots[i].addr[b],(addr>>b)&1);
latchReset(core.slots[i].valid,1);
addr+=4;
}
for(var i=0;i<QUEUE_SLOTS*4 && i<STORE_SIZE;i++){
var ins=pad[i>>2];
var byteVal=ins[i&3]&0xFF;
writeStoreByte(i,byteVal);
}
}
function autoStart(){for(var i=0;i<sws.length;i++){if(sws[i].label==="RUN_Q"){sws[i].v=1;}}}
function initProj(){
var box=document.getElementById("projSel");var dd=document.getElementById("projDropdown");
if(!window.BUILTIN_PROJECTS||!window.BUILTIN_PROJECTS.projects||!window.BUILTIN_PROJECTS.projects.length){box.style.display="none";loadProgram({program:[NOOP.slice()]});autoStart();return;}
var list=window.BUILTIN_PROJECTS.projects;
while(dd.firstChild)dd.removeChild(dd.firstChild);
for(var i=0;i<list.length;i++){var o=document.createElement("option");o.value=list[i].id;o.textContent=list[i].name;o.title=list[i].description||"";dd.appendChild(o);}
dd.onchange=function(){for(var j=0;j<list.length;j++){if(list[j].id===dd.value){loadProgram(list[j]);autoStart();simulate();return;}}};
box.style.display="flex";
loadProgram(list[0]);
autoStart();
}
function routeWires(){
var STEP=2,buckets={},list=[],i,w;
for(i=0;i<wires.length;i++){w=wires[i];delete w.mx;if(w.s.x===undefined)continue;if(w.l){w.ex=w.l.px-(w.l.sz||22)*0.4-2;w.ey=w.l.py;}else if(w.g&&w.g.px!==undefined){w.ex=w.g.px-6;w.ey=w.g.py+w.py;}else{continue;}if(Math.abs(w.s.y-w.ey)<3)continue;list.push(w);}
list.sort(function(a,b){return Math.abs(b.ey-b.s.y)-Math.abs(a.ey-a.s.y);});
for(i=0;i<list.length;i++){w=list[i];var y1=Math.min(w.s.y,w.ey)-1,y2=Math.max(w.s.y,w.ey)+1;var ideal=w.s.x+(w.ex-w.s.x)/2,base=Math.round(ideal/STEP),pick=null;
for(var d=0;d<400&&pick===null;d++){for(var sg=(d===0?1:-1);sg<=1&&pick===null;sg+=2){var key=base+sg*d,arr=buckets[key],ok=true;if(arr)for(var m=0;m<arr.length;m++){var o=arr[m];if(o.n!==w.s&&o.a<y2&&o.b>y1){ok=false;break;}}if(ok)pick=key;}}
if(pick===null)pick=base;(buckets[pick]||(buckets[pick]=[])).push({a:y1,b:y2,n:w.s});w.mx=pick*STEP;}
}
function relayout43(){
var GX=22,GY=26,M=60,TOP=110,RATIO=16/9,CG=150,RG=55;
var secs=sectionsData,n=secs.length,i,k,maxW=0,totW=0,idx={};
if(!n)return null;
for(i=0;i<n;i++){idx[secs[i].title]=i;if(secs[i].w>maxW)maxW=secs[i].w;totW+=secs[i].w+GX;}
var fixed=[],isFix={},y=0,inW=0;
var INP=["INPUT · OPCODE (8)","INPUT · DATA (8)","INPUT · TAG (8)","INPUT · ADDR (7)","INPUT · ACTION","INPUT · CLK","QUEUE · ADDR (7)","QUEUE · ACTION","QUEUE · QCLK"];
for(k=0;k<INP.length;k++){var a=idx[INP[k]];if(a===undefined)continue;fixed.push({i:a,x:0,y:y});y+=secs[a].h+RG;if(secs[a].w>inW)inW=secs[a].w;}
var x0=inW+CG;
var sc=idx["SCREEN · GRID"],rv=idx["OUTPUT · RAM VIEW"],sv=idx["OUTPUT · STORAGE VIEW"],joy=idx["INPUT · JOYSTICK"];
if(sc!==undefined){
fixed.push({i:sc,x:x0,y:0});
if(joy!==undefined) fixed.push({i:joy,x:x0,y:secs[sc].h+GY});
var x1=x0+secs[sc].w+CG;
var yAcc=0;
if(rv!==undefined){fixed.push({i:rv,x:x1,y:yAcc});yAcc+=secs[rv].h+GY;}
if(sv!==undefined){fixed.push({i:sv,x:x1,y:yAcc});}
}
for(k=0;k<fixed.length;k++)isFix[fixed[k].i]=1;
function pack(Wp){
var placed=[],pos=[],usedW=0,usedH=0,j,c,rr;
for(j=0;j<fixed.length;j++){var f=fixed[j],q=secs[f.i];placed.push({x:f.x,y:f.y,w:q.w,h:q.h});pos[f.i]={x:f.x,y:f.y};if(f.x+q.w>usedW)usedW=f.x+q.w;if(f.y+q.h>usedH)usedH=f.y+q.h;}
for(j=0;j<n;j++){
if(isFix[j])continue;
var s=secs[j],cand=[0],bx=0,by=Infinity;
for(k=0;k<placed.length;k++){cand.push(placed[k].x);cand.push(placed[k].x+placed[k].w+GX);}
for(c=0;c<cand.length;c++){
var x=cand[c];
if(x>0&&x+s.w>Wp)continue;
var yy=0;
for(k=0;k<placed.length;k++){rr=placed[k];if(rr.x<x+s.w+GX&&rr.x+rr.w+GX>x){var yb=rr.y+rr.h+GY;if(yb>yy)yy=yb;}}
if(yy<by||(yy===by&&x<bx)){by=yy;bx=x;}
}
placed.push({x:bx,y:by,w:s.w,h:s.h});pos[j]={x:bx,y:by};
if(bx+s.w>usedW)usedW=bx+s.w;if(by+s.h>usedH)usedH=by+s.h;
}
return {pos:pos,w:usedW,h:usedH};
}
function fit(p){var wN=p.w+2*M,hN=p.h+TOP+M,W,H;if(wN/hN<RATIO){H=hN;W=hN*RATIO;}else{W=wN;H=wN/RATIO;}return {W:W,H:H};}
var best=null,bestArea=Infinity;
for(var t=0;t<=30;t++){var Wp=maxW*Math.pow(totW/maxW,t/30);var p=pack(Wp),f2=fit(p),ar=f2.W*f2.H;if(ar<bestArea){bestArea=ar;best={p:p,f:f2};}}
for(i=0;i<n;i++){
var sc2=secs[i],nx=M+best.p.pos[i].x,ny=TOP+best.p.pos[i].y;
var dx=nx-sc2.x,dy=ny-sc2.y;
for(k=sc2.g0;k<sc2.g1;k++){var g=gates[k];g.px+=dx;g.py+=dy;g.o.x+=dx;g.o.y+=dy;}
for(k=sc2.s0;k<sc2.s1;k++){var q2=sws[k];q2.px+=dx;q2.py+=dy;q2.o.x+=dx;q2.o.y+=dy;}
for(k=sc2.l0;k<sc2.l1;k++){var l=leds[k];l.px+=dx;l.py+=dy;if(l.ph){l.ph.x=l.px-2;l.ph.y=l.py;}}
for(k=sc2.lt0;k<sc2.lt1;k++){var lt=latches[k];lt.px+=dx;lt.py+=dy;lt.o.x+=dx;lt.o.y+=dy;}
sc2.x=nx;sc2.y=ny;
}
return {x:0,y:0,w:best.f.W,h:best.f.H};
}
function fitView(){
if(!frame43)return;
var r=svg.getBoundingClientRect();
var k=Math.min(r.width/frame43.w, r.height/frame43.h)*0.95;
if(k<0.0005)k=0.0005;
view.k=k;
view.x=(r.width - frame43.w*k)/2 - frame43.x*k;
view.y=(r.height - frame43.h*k)/2 - frame43.y*k;
applyView();
}
function fitScreen(){
var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,found=false;
for(var i=0;i<sectionsData.length;i++){
var s=sectionsData[i];
if(s.title!=="SCREEN · GRID")continue;
found=true;
if(s.x<minX)minX=s.x;if(s.y<minY)minY=s.y;
if(s.x+s.w>maxX)maxX=s.x+s.w;if(s.y+s.h>maxY)maxY=s.y+s.h;
}
if(!found){fitView();return;}
var w=maxX-minX,h=maxY-minY;
var r=svg.getBoundingClientRect();
var k=Math.min(r.width/(w+120), r.height/(h+120))*0.95;
view.k=k;
view.x=(r.width - w*k)/2 - minX*k;
view.y=(r.height - h*k)/2 - minY*k;
applyView();
}
function updateGateCount(){
var logicGates=gates.length;
document.getElementById("gcount").textContent="· "+logicGates.toLocaleString()+" LOGIC GATES · "+latches.length.toLocaleString()+" FFs";
}
function loadProject(){
try{
reset();
buildFrontend();
buildJoystick();
buildQueue();
buildExecutor();
buildBackend();
frame43=relayout43();
routeWires();
initProj();
simulate();
fitView();
updateGateCount();
renderFrame();
}catch(e){showErr((e&&e.message)||String(e));console.error(e);if(e&&e.stack)console.error(e.stack);}
}

var view={x:0,y:0,k:1};
var MIN_K=0.0002,MAX_K=30;
function applyView(){if(vp)vp.setAttribute("transform","translate("+view.x+","+view.y+") scale("+view.k+")");}
function setZoomAt(nk,cx,cy){nk=Math.min(MAX_K,Math.max(MIN_K,nk));var s=nk/view.k;view.x=cx-(cx-view.x)*s;view.y=cy-(cy-view.y)*s;view.k=nk;applyView();}
function zoomC(f){var r=svg.getBoundingClientRect();setZoomAt(view.k*f,r.width/2,r.height/2);}
svg.addEventListener("wheel",function(e){e.preventDefault();var r=svg.getBoundingClientRect();setZoomAt(view.k*(e.deltaY<0?1.12:1/1.12),e.clientX-r.left,e.clientY-r.top);},{passive:false});
var ptrs={},panS=null,pinchS=null,mode=null;
svg.addEventListener("pointerdown",function(e){
if(e.target&&e.target.classList&&e.target.classList.contains("swhit"))return;
if(e.target&&e.target.parentNode&&e.target.parentNode.classList&&e.target.parentNode.classList.contains("swhit"))return;
if(e.button!==undefined&&e.button!==0&&e.pointerType==="mouse")return;
ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
try{svg.setPointerCapture(e.pointerId);}catch(err){}
var ids=Object.keys(ptrs);
if(ids.length===1){mode="pan";panS={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y,moved:false};svg.classList.add("drag");}
else if(ids.length===2){mode="pinch";var p0=ptrs[ids[0]],p1=ptrs[ids[1]];pinchS={d:Math.hypot(p0.x-p1.x,p0.y-p1.y),cx:(p0.x+p1.x)/2,cy:(p0.y+p1.y)/2,k:view.k,x:view.x,y:view.y};panS=null;}
});
svg.addEventListener("pointermove",function(e){
if(!ptrs[e.pointerId])return;
ptrs[e.pointerId].x=e.clientX;ptrs[e.pointerId].y=e.clientY;
if(mode==="pinch"){var ids=Object.keys(ptrs);if(ids.length<2)return;
var p0=ptrs[ids[0]],p1=ptrs[ids[1]];var d=Math.hypot(p0.x-p1.x,p0.y-p1.y);var cx=(p0.x+p1.x)/2,cy=(p0.y+p1.y)/2;
var r=svg.getBoundingClientRect();var f=d/pinchS.d;var nk=Math.min(MAX_K,Math.max(MIN_K,pinchS.k*f));var s=nk/pinchS.k;
var mx=pinchS.cx-r.left,my=pinchS.cy-r.top;var nmx=cx-r.left,nmy=cy-r.top;
view.x=nmx-(mx-pinchS.x)*s;view.y=nmy-(my-pinchS.y)*s;view.k=nk;applyView();
}else if(mode==="pan"&&panS){
var dx=e.clientX-panS.x,dy=e.clientY-panS.y;
if(Math.abs(dx)>3||Math.abs(dy)>3)panS.moved=true;
if(panS.moved){view.x=panS.ox+dx;view.y=panS.oy+dy;applyView();}
}
});
function endPtr(e){
delete ptrs[e.pointerId];
var ids=Object.keys(ptrs);
if(ids.length===0){mode=null;panS=null;pinchS=null;svg.classList.remove("drag");}
else if(ids.length===1){mode="pan";var id=ids[0];panS={x:ptrs[id].x,y:ptrs[id].y,ox:view.x,oy:view.y,moved:false};pinchS=null;}
}
svg.addEventListener("pointerup",endPtr);
svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("pointerleave",function(e){if(ptrs[e.pointerId])endPtr(e);});
svg.addEventListener("dblclick",function(){
if(view.k>0.05)fitScreen();else fitView();
});
document.getElementById("zoomIn").addEventListener("click",function(){zoomC(1.3);});
document.getElementById("zoomOut").addEventListener("click",function(){zoomC(1/1.3);});
document.getElementById("zoomReset").addEventListener("click",function(){fitView();});

var statPC=document.getElementById("statPC");
var statCLK=document.getElementById("statCLK");

loadProject();

setInterval(function(){gInvertState = gInvertState ? 0 : 1;}, INVERT_PERIOD_MS);

setInterval(function(){
  try{
    tickOsc();
    simulate();
    gCLKCount++;
    statPC.textContent = core.ptr ? (core.ptr[0].o.v + core.ptr[1].o.v*2 + core.ptr[2].o.v*4 + core.ptr[3].o.v*8) : 0;
    statCLK.textContent = gCLKCount;
  }catch(e){showErr((e&&e.message)||String(e));}
},100);
var lastR=0;
requestAnimationFrame(function loop(t){requestAnimationFrame(loop);if(t-lastR<33)return;lastR=t;try{renderFrame();}catch(e){showErr((e&&e.message)||String(e));}});
})();
</script>
