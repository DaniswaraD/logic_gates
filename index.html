<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logic Bench - Komputer 1 Byte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f1; --panel:#ffffff; --panel2:#f6faf8; --line:#ccdad3;
    --text:#15251e; --text-dim:#63796f; --trace-off:#b7c8c0; --trace-on:#0f9d58;
    --gate-fill:#ffffff; --gate-border:#8ba79a; --gate-border-hi:#3f6b58;
    --led-off:#dee4e1; --led-on:#ff3d1f; --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{padding:10px 18px 8px; border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0;}
  header h1{margin:0 0 2px; font-size:15px; font-weight:600;}
  header p{margin:0; font-size:11px; color:var(--text-dim); line-height:1.4;}
  .toolbar{
    display:flex; flex-wrap:wrap; gap:6px; padding:8px 18px;
    border-bottom:1px solid var(--line); background:var(--panel2); flex-shrink:0;
    align-items:center;
  }
  .toolbar button{
    font-family:inherit; font-size:12px; color:var(--text); background:#fff;
    border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer;
  }
  .toolbar button:hover{border-color:var(--gate-border-hi); background:#f2f8f5;}
  .toolbar .sep{width:1px; background:var(--line); margin:2px 4px; height:20px;}
  .toolbar button.danger{color:var(--danger); border-color:#e8c2bc;}
  .toolbar .val{
    margin-left:auto; background:#0f1b16; color:#a7e0bd;
    padding:6px 14px; border-radius:6px; font-size:14px; font-weight:600;
    letter-spacing:.05em; min-width:140px; text-align:center;
  }
  .keypad{
    display:grid; grid-template-columns:repeat(6,1fr); gap:6px;
    padding:10px 18px; background:#e8f4ee; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .keypad button{
    font-family:inherit; font-size:15px; font-weight:600; color:var(--text);
    background:#fff; border:1px solid #b6d2c4; border-radius:8px;
    padding:9px 4px; cursor:pointer;
  }
  .keypad button:hover{background:#d4ede0;}
  .keypad button:active{transform:scale(.96);}
  .keypad button.op{background:#fff5e6; border-color:#e0c69e; color:#7a4a00;}
  .keypad button.op:hover{background:#ffe9c4;}
  .keypad button.eq{background:#0f9d58; color:#fff; border-color:#0a7a44;}
  .keypad button.clr{background:#fdecea; color:#c0392b; border-color:#e8c2bc;}
  .stage{
    flex:1; overflow:auto; position:relative;
    background:radial-gradient(circle at 1px 1px,#d2dfd8 1.4px,transparent 0) 0 0/22px 22px;
  }
  .content{position:relative; width:2400px; height:2200px;}
  svg.wires{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;}
  svg.wires path.hit{pointer-events:stroke; cursor:pointer;}
  .node{position:absolute; touch-action:none; cursor:grab; user-select:none;}
  .node.dragging{cursor:grabbing; z-index:5;}
  .node-body{
    width:100%; height:100%; background:var(--gate-fill); border:1.5px solid var(--gate-border);
    display:flex; align-items:center; justify-content:center; font-size:10px;
    color:var(--text); position:relative;
    box-shadow:0 1px 2px rgba(21,37,30,.06);
  }
  .type-AND .node-body,.type-NAND .node-body{border-radius:0 22px 22px 0;}
  .type-OR .node-body,.type-NOR .node-body,.type-XOR .node-body,.type-XNOR .node-body{
    clip-path:polygon(0 0,55% 0,100% 50%,55% 100%,0 100%,18% 50%); padding-left:6px;
  }
  .type-NOT .node-body{clip-path:polygon(0 0,82% 50%,0 100%); padding-right:12px;}
  .bubble{
    position:absolute; right:-8px; top:50%; transform:translateY(-50%);
    width:8px; height:8px; border-radius:50%; background:#fff;
    border:1.5px solid var(--gate-border-hi);
  }
  .type-INPUT .node-body{
    border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;
    background:#f0f4f2; border-color:#b6c6bf;
  }
  .type-INPUT.on .node-body{background:#d6f5e3; border-color:var(--trace-on); color:#0b7a44;}
  .type-OUTPUT .node-body{border-radius:50%; background:var(--led-off); border-color:#c3ccc8;}
  .type-OUTPUT.on .node-body{background:var(--led-on); border-color:#ff9c86; box-shadow:0 0 12px 2px rgba(255,61,31,.5);}
  .label{
    position:absolute; bottom:-14px; left:0; width:100%; text-align:center;
    font-size:8px; color:var(--text-dim); white-space:nowrap;
  }
  .pin{
    position:absolute; width:9px; height:9px; border-radius:50%; top:50%;
    background:var(--trace-off); border:1.5px solid #fff; cursor:crosshair; z-index:2;
    box-shadow:0 0 0 1px var(--gate-border);
  }
  .pin.active{background:var(--trace-on); box-shadow:0 0 0 1px var(--trace-on);}
  .pin-in{left:-5px;}
  .pin-out{right:-5px;}
  .node-del{
    position:absolute; top:-8px; right:-8px; width:15px; height:15px; border-radius:50%;
    background:#fdecea; color:var(--danger); font-size:10px; line-height:14px; text-align:center;
    cursor:pointer; border:1px solid #e8c2bc; display:none; z-index:3;
  }
  .node:hover .node-del{display:block;}
  path.wire{fill:none; stroke:#7c9186; stroke-width:2;}
  path.wire.active{stroke:#0f9d58;}
  path.temp{fill:none; stroke:#3f6b58; stroke-width:2; stroke-dasharray:4 4;}
  footer{padding:6px 18px; font-size:10.5px; color:var(--text-dim); border-top:1px solid var(--line); background:var(--panel); flex-shrink:0;}
  @media (max-width:640px){
    header p{display:none;}
    .keypad button{font-size:14px; padding:7px 2px;}
  }
</style>
</head>
<body>
<header>
  <h1>Logic Bench - Komputer 1 Byte</h1>
  <p>ALU dan RAM di bawah ini dibangun murni dari gerbang logika dasar. Klik switch untuk mengubah nilai, atau pakai keypad untuk input angka dan operasi.</p>
</header>
<div class="toolbar" id="toolbar"></div>
<div class="keypad" id="keypad"></div>
<div class="stage" id="stage">
  <div class="content" id="content">
    <svg class="wires" id="wires"></svg>
  </div>
</div>
<footer>Titik hijau = sinyal 1. LED merah = output 1. Semua gerbang dan kabel dibuat manual dari primitif logika.</footer>

<script>
/* ============================================================
   PRIMITIVE GATES
   ============================================================ */
const PRIM = {
  AND:  (a,b) => (a & b) ? 1 : 0,
  OR:   (a,b) => (a | b) ? 1 : 0,
  NOT:  a => a ? 0 : 1,
  NAND: (a,b) => (a & b) ? 0 : 1,
  NOR:  (a,b) => (a | b) ? 0 : 1,
  XOR:  (a,b) => (a ^ b) ? 1 : 0,
  XNOR: (a,b) => (a ^ b) ? 0 : 1
};

const CFG = {
  AND:  {in:2, out:1, w:48, h:32, label:'AND'},
  OR:   {in:2, out:1, w:48, h:32, label:'OR'},
  NOT:  {in:1, out:1, w:38, h:26, label:'NOT', bubble:true},
  NAND: {in:2, out:1, w:54, h:32, label:'NAND', bubble:true},
  NOR:  {in:2, out:1, w:48, h:32, label:'NOR', bubble:true},
  XOR:  {in:2, out:1, w:48, h:32, label:'XOR'},
  XNOR: {in:2, out:1, w:54, h:32, label:'XNOR', bubble:true},
  INPUT:{in:0, out:1, w:40, h:26, label:'SW'},
  OUTPUT:{in:1,out:0, w:28, h:28, label:'LED'}
};

/* ============================================================
   STATE
   ============================================================ */
let nodes = [], conns = [];
let nid = 1, cid = 1;

function gate(type, x, y, name, initOut){
  const cfg = CFG[type];
  const n = {
    id: nid++, type, x, y, w: cfg.w, h: cfg.h,
    name: name || null,
    state: 0,
    out: [0],
    initOut: initOut !== undefined ? initOut : null,
    inCount: cfg.in, outCount: cfg.out
  };
  nodes.push(n);
  return n.id;
}
function wire(from, fp, to, tp){
  conns.push({id: cid++, from, fromIdx: fp, to, toIdx: tp});
}
function sw(x, y, name){ return gate('INPUT', x, y, name); }
function led(x, y, name){ return gate('OUTPUT', x, y, name); }

/* ============================================================
   BUILD ALU (8-bit, from primitive gates only)
   ============================================================ */
const ALU = {
  A: [], B: [], op: [], result: [], flags: {}
};

function buildALU(){
  const A = [], B = [];
  for(let i=0;i<8;i++){
    A.push(sw(20, 80 + i*100, 'A' + i));
    B.push(sw(90, 80 + i*100, 'B' + i));
  }
  const op0 = sw(20, 10, 'OP0');
  const op1 = sw(90, 10, 'OP1');
  ALU.A = A; ALU.B = B; ALU.op = [op0, op1];

  const nOp0 = gate('NOT', 180, 15);
  wire(op0, 0, nOp0, 0);
  const nOp1 = gate('NOT', 250, 15);
  wire(op1, 0, nOp1, 0);
  const subGate = gate('AND', 330, 15, 'SUB');
  wire(nOp1, 0, subGate, 0);
  wire(op0, 0, subGate, 1);

  let cin = subGate;
  const sums = [];
  for(let i=0;i<8;i++){
    const yb = 80 + i*100;
    const bi = gate('XOR', 180, yb + 15);
    wire(B[i], 0, bi, 0);
    wire(subGate, 0, bi, 1);

    const x1 = gate('XOR', 270, yb + 15);
    wire(A[i], 0, x1, 0);
    wire(bi, 0, x1, 1);

    const x2 = gate('XOR', 360, yb + 15, 'S' + i);
    wire(x1, 0, x2, 0);
    wire(cin, 0, x2, 1);

    const a1 = gate('AND', 270, yb + 55);
    wire(A[i], 0, a1, 0);
    wire(bi, 0, a1, 1);

    const a2 = gate('AND', 360, yb + 55);
    wire(x1, 0, a2, 0);
    wire(cin, 0, a2, 1);

    const co = gate('OR', 450, yb + 35);
    wire(a1, 0, co, 0);
    wire(a2, 0, co, 1);

    const band = gate('AND', 450, yb + 15);
    wire(A[i], 0, band, 0);
    wire(B[i], 0, band, 1);
    const bor = gate('OR', 450, yb + 55);
    wire(A[i], 0, bor, 0);
    wire(B[i], 0, bor, 1);

    const m1a = gate('AND', 570, yb + 15);
    wire(band, 0, m1a, 0);
    wire(nOp0, 0, m1a, 1);
    const m1b = gate('AND', 570, yb + 55);
    wire(bor, 0, m1b, 0);
    wire(op0, 0, m1b, 1);
    const m1 = gate('OR', 660, yb + 35);
    wire(m1a, 0, m1, 0);
    wire(m1b, 0, m1, 1);

    const m2a = gate('AND', 750, yb + 15);
    wire(x2, 0, m2a, 0);
    wire(nOp1, 0, m2a, 1);
    const m2b = gate('AND', 750, yb + 55);
    wire(m1, 0, m2b, 0);
    wire(op1, 0, m2b, 1);
    const m2 = gate('OR', 840, yb + 35, 'R' + i);
    wire(m2a, 0, m2, 0);
    wire(m2b, 0, m2, 1);

    const out = led(940, yb + 26, 'R' + i);
    wire(m2, 0, out, 0);

    cin = co;
    sums.push(m2);
    ALU.result.push(out);
  }

  const cf = led(1030, 108, 'CF');
  wire(cin, 0, cf, 0);

  const l1 = [];
  for(let i=0;i<8;i+=2){
    const o = gate('OR', 1030, 200 + i*28);
    wire(sums[i], 0, o, 0);
    wire(sums[i+1], 0, o, 1);
    l1.push(o);
  }
  const l2 = [];
  for(let i=0;i<4;i+=2){
    const o = gate('OR', 1110, 200 + i*28);
    wire(l1[i], 0, o, 0);
    wire(l1[i+1], 0, o, 1);
    l2.push(o);
  }
  const orAll = gate('OR', 1190, 228);
  wire(l2[0], 0, orAll, 0);
  wire(l2[1], 0, orAll, 1);
  const zf = gate('NOT', 1270, 228, 'ZF');
  wire(orAll, 0, zf, 0);
  const zfLed = led(1350, 215, 'ZF');
  wire(zf, 0, zfLed, 0);

  const nfLed = led(1270, 340, 'NF');
  wire(sums[7], 0, nfLed, 0);

  const nzf = gate('NOT', 1350, 340);
  wire(zf, 0, nzf, 0);
  const gt = gate('AND', 1430, 340, 'GT');
  wire(cin, 0, gt, 0);
  wire(nzf, 0, gt, 1);
  const gtLed = led(1510, 327, 'A>B');
  wire(gt, 0, gtLed, 0);

  const lt = gate('NOT', 1430, 420, 'LT');
  wire(cin, 0, lt, 0);
  const ltLed = led(1510, 407, 'A<B');
  wire(lt, 0, ltLed, 0);

  const eqLed = led(1430, 500, 'A=B');
  wire(zf, 0, eqLed, 0);

  ALU.flags = {cf, zf: zfLed, nf: nfLed, gt: gtLed, lt: ltLed, eq: eqLed};
}

/* ============================================================
   BUILD RAM (2 alamat x 8 bit, dari latch NAND)
   ============================================================ */
const RAM = { addr: null, we: null, data: [], out: [] };

function buildRAM(){
  const Y0 = 1080;
  const A0 = sw(20, Y0, 'RA0');
  const WE = sw(20, Y0 + 70, 'WE');
  RAM.addr = A0; RAM.we = WE;

  const nA0 = gate('NOT', 140, Y0);
  wire(A0, 0, nA0, 0);

  const en0 = gate('AND', 220, Y0);
  wire(nA0, 0, en0, 0);
  wire(WE, 0, en0, 1);

  const en1 = gate('AND', 220, Y0 + 70);
  wire(A0, 0, en1, 0);
  wire(WE, 0, en1, 1);

  const D = [];
  for(let i=0;i<8;i++){
    D.push(sw(20, Y0 + 150 + i*45, 'D' + i));
  }
  RAM.data = D;

  const Q0 = [], Q1 = [];
  for(let j=0;j<8;j++){
    const lx = 380 + j*160;

    const y0 = Y0 + 40;
    const nD0 = gate('NOT', lx, y0);
    wire(D[j], 0, nD0, 0);
    const S0 = gate('NAND', lx + 45, y0);
    wire(D[j], 0, S0, 0);
    wire(en0, 0, S0, 1);
    const R0 = gate('NAND', lx + 45, y0 + 40);
    wire(nD0, 0, R0, 0);
    wire(en0, 0, R0, 1);
    const Qa0 = gate('NAND', lx + 95, y0 + 40, 'Q0_' + j, 0);
    const Qb0 = gate('NAND', lx + 95, y0, null, 1);
    wire(S0, 0, Qa0, 0);
    wire(Qb0, 0, Qa0, 1);
    wire(R0, 0, Qb0, 0);
    wire(Qa0, 0, Qb0, 1);
    Q0.push(Qa0);

    const y1 = Y0 + 140;
    const nD1 = gate('NOT', lx, y1);
    wire(D[j], 0, nD1, 0);
    const S1 = gate('NAND', lx + 45, y1);
    wire(D[j], 0, S1, 0);
    wire(en1, 0, S1, 1);
    const R1 = gate('NAND', lx + 45, y1 + 40);
    wire(nD1, 0, R1, 0);
    wire(en1, 0, R1, 1);
    const Qa1 = gate('NAND', lx + 95, y1 + 40, 'Q1_' + j, 0);
    const Qb1 = gate('NAND', lx + 95, y1, null, 1);
    wire(S1, 0, Qa1, 0);
    wire(Qb1, 0, Qa1, 1);
    wire(R1, 0, Qb1, 0);
    wire(Qa1, 0, Qb1, 1);
    Q1.push(Qa1);
  }

  for(let j=0;j<8;j++){
    const mx = 400 + j * 140;
    const my = Y0 + 320;
    const and0 = gate('AND', mx, my);
    wire(Q0[j], 0, and0, 0);
    wire(nA0, 0, and0, 1);
    const and1 = gate('AND', mx, my + 60);
    wire(Q1[j], 0, and1, 0);
    wire(A0, 0, and1, 1);
    const or1 = gate('OR', mx + 80, my + 30);
    wire(and0, 0, or1, 0);
    wire(and1, 0, or1, 1);
    const l = led(mx + 160, my + 16, 'Q' + j);
    wire(or1, 0, l, 0);
    RAM.out.push(l);
  }
}

buildALU();
buildRAM();

/* ============================================================
   SIMULATION - pure gate propagation
   ============================================================ */
function simulate(){
  const N = nodes.length;
  const idx = new Map();
  nodes.forEach((n, i) => idx.set(n.id, i));

  const wireMap = new Map();
  conns.forEach(c => {
    wireMap.set(c.to + ':' + c.toIdx, c);
  });

  const P = 100;
  let v = new Array(N);
  for(let i=0;i<N;i++){
    const n = nodes[i];
    if(n.initOut !== null) v[i] = n.initOut;
    else if(n.type === 'NAND' || n.type === 'NOT') v[i] = 1;
    else if(n.type === 'INPUT') v[i] = n.state;
    else v[i] = 0;
  }

  for(let pass=0; pass<P; pass++){
    const prev = v;
    const next = new Array(N);
    for(let i=0;i<N;i++){
      const n = nodes[i];
      const cfg = CFG[n.type];
      if(n.type === 'INPUT'){ next[i] = n.state; continue; }

      const ins = new Array(cfg.in).fill(0);
      for(let k=0;k<cfg.in;k++){
        const c = wireMap.get(n.id + ':' + k);
        if(c){
          const j = idx.get(c.from);
          if(j !== undefined) ins[k] = prev[j] | 0;
        }
      }

      if(n.type === 'OUTPUT'){ next[i] = ins[0] | 0; continue; }

      next[i] = PRIM[n.type](ins[0] | 0, ins[1] | 0);
    }
    v = next;
  }

  nodes.forEach((n, i) => { n.out = [v[i] | 0]; });
  updateUI();
}

/* ============================================================
   UI
   ============================================================ */
function pinPos(node, kind, idx){
  const cfg = CFG[node.type];
  const total = kind === 'out' ? cfg.out : cfg.in;
  return {
    x: kind === 'out' ? node.x + cfg.w : node.x,
    y: node.y + cfg.h * (idx + 1) / (total + 1)
  };
}

function renderAll(){
  content.querySelectorAll('.node').forEach(e => e.remove());
  nodes.forEach(n => {
    const cfg = CFG[n.type];
    const el = document.createElement('div');
    el.className = 'node type-' + n.type;
    el.dataset.id = n.id;
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.width = cfg.w + 'px';
    el.style.height = cfg.h + 'px';

    let inner = '<div class="node-del">x</div><div class="node-body">';
    if(n.type === 'INPUT') inner += '<span class="sw">' + n.state + '</span>';
    else if(n.type === 'OUTPUT') inner += '';
    else {
      inner += '<span>' + cfg.label + '</span>';
      if(cfg.bubble) inner += '<div class="bubble"></div>';
    }
    inner += '</div>';
    if(n.name) inner += '<div class="label">' + n.name + '</div>';

    for(let i=0;i<cfg.in;i++){
      const py = cfg.h * (i + 1) / (cfg.in + 1);
      inner += '<div class="pin pin-in" data-idx="' + i + '" style="top:' + py + 'px"></div>';
    }
    if(cfg.out > 0){
      for(let i=0;i<cfg.out;i++){
        const py = cfg.h * (i + 1) / (cfg.out + 1);
        inner += '<div class="pin pin-out" data-idx="' + i + '" style="top:' + py + 'px"></div>';
      }
    }
    el.innerHTML = inner;
    content.appendChild(el);
  });
  drawWires();
  simulate();
}

function drawWires(){
  wiresSvg.innerHTML = '';
  conns.forEach(c => {
    const from = nodes.find(n => n.id === c.from);
    const to = nodes.find(n => n.id === c.to);
    if(!from || !to) return;
    const p1 = pinPos(from, 'out', c.fromIdx);
    const p2 = pinPos(to, 'in', c.toIdx);
    const d = 'M ' + p1.x + ' ' + p1.y + ' L ' + p2.x + ' ' + p2.y;
    const active = (from.out[c.fromIdx] | 0) === 1;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'wire' + (active ? ' active' : ''));
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'hit');
    hit.setAttribute('stroke', 'transparent');
    hit.setAttribute('stroke-width', '14');
    hit.dataset.id = c.id;
    wiresSvg.appendChild(path);
    wiresSvg.appendChild(hit);
  });
}

function updateUI(){
  nodes.forEach(n => {
    const el = document.querySelector('.node[data-id="' + n.id + '"]');
    if(!el) return;
    if(n.type === 'INPUT'){
      el.classList.toggle('on', n.state === 1);
      const sw = el.querySelector('.sw');
      if(sw) sw.textContent = n.state;
    }
    if(n.type === 'OUTPUT'){
      el.classList.toggle('on', (n.out[0] | 0) === 1);
    }
    el.querySelectorAll('.pin-out').forEach(p => {
      p.classList.toggle('active', (n.out[+p.dataset.idx] | 0) === 1);
    });
    el.querySelectorAll('.pin-in').forEach(p => {
      const idx = +p.dataset.idx;
      const c = conns.find(c => c.to === n.id && c.toIdx === idx);
      const from = c ? nodes.find(m => m.id === c.from) : null;
      const v = from ? (from.out[c.fromIdx] | 0) : 0;
      p.classList.toggle('active', v === 1);
    });
  });
  drawWires();
}

/* ============================================================
   INTERACTION
   ============================================================ */
const content = document.getElementById('content');
const wiresSvg = document.getElementById('wires');
const stage = document.getElementById('stage');

let dragging = null;
let wiring = null;

content.addEventListener('pointerdown', e => {
  const del = e.target.closest('.node-del');
  if(del){ removeNode(+del.closest('.node').dataset.id); return; }

  const pinOut = e.target.closest('.pin-out');
  if(pinOut){
    const nodeEl = pinOut.closest('.node');
    wiring = {from: +nodeEl.dataset.id, fromIdx: +pinOut.dataset.idx};
    e.stopPropagation();
    return;
  }
  if(e.target.closest('.pin-in')) return;

  const inBody = e.target.closest('.type-INPUT .node-body');
  if(inBody){ toggleInput(+inBody.closest('.node').dataset.id); return; }

  const nodeEl = e.target.closest('.node');
  if(nodeEl){
    const n = nodes.find(n => n.id === +nodeEl.dataset.id);
    if(!n) return;
    const rect = content.getBoundingClientRect();
    dragging = {node: n, dx: (e.clientX - rect.left) - n.x, dy: (e.clientY - rect.top) - n.y};
    nodeEl.classList.add('dragging');
  }
});

document.addEventListener('pointermove', e => {
  if(dragging){
    const rect = content.getBoundingClientRect();
    dragging.node.x = Math.max(0, (e.clientX - rect.left) - dragging.dx);
    dragging.node.y = Math.max(0, (e.clientY - rect.top) - dragging.dy);
    const el = document.querySelector('.node[data-id="' + dragging.node.id + '"]');
    if(el){ el.style.left = dragging.node.x + 'px'; el.style.top = dragging.node.y + 'px'; }
    drawWires();
  }
  if(wiring) updateTemp(e);
});

document.addEventListener('pointerup', e => {
  if(dragging){
    const el = document.querySelector('.node.dragging');
    if(el) el.classList.remove('dragging');
    dragging = null;
  }
  if(wiring) finishWire(e);
});

function updateTemp(e){
  const rect = content.getBoundingClientRect();
  const from = nodes.find(n => n.id === wiring.from);
  if(!from) return;
  const p1 = pinPos(from, 'out', wiring.fromIdx);
  const p2 = {x: e.clientX - rect.left, y: e.clientY - rect.top};
  let temp = document.getElementById('tempWire');
  if(!temp){
    temp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    temp.id = 'tempWire';
    temp.setAttribute('class', 'temp');
    wiresSvg.appendChild(temp);
  }
  temp.setAttribute('d', 'M ' + p1.x + ' ' + p1.y + ' L ' + p2.x + ' ' + p2.y);
}

function finishWire(e){
  const target = e.target.closest('.pin-in');
  const temp = document.getElementById('tempWire');
  if(temp) temp.remove();
  if(target){
    const toNode = +target.closest('.node').dataset.id;
    const toIdx = +target.dataset.idx;
    conns = conns.filter(c => !(c.to === toNode && c.toIdx === toIdx));
    if(toNode !== wiring.from) wire(wiring.from, wiring.fromIdx, toNode, toIdx);
  }
  wiring = null;
  simulate();
}

wiresSvg.addEventListener('click', e => {
  const hit = e.target.closest('.hit');
  if(hit){ conns = conns.filter(c => c.id !== +hit.dataset.id); simulate(); }
});

function removeNode(id){
  nodes = nodes.filter(n => n.id !== id);
  conns = conns.filter(c => c.from !== id && c.to !== id);
  renderAll();
}

function toggleInput(id){
  const n = nodes.find(n => n.id === id);
  if(!n) return;
  n.state = n.state ? 0 : 1;
  simulate();
}

/* ============================================================
   TOOLBAR
   ============================================================ */
const toolbar = document.getElementById('toolbar');
['AND','OR','NOT','NAND','NOR','XOR','XNOR'].forEach(t => {
  const b = document.createElement('button');
  b.textContent = '+ ' + t;
  b.onclick = () => {
    gate(t, 200 + Math.random() * 800, 1800 + Math.random() * 300);
    renderAll();
  };
  toolbar.appendChild(b);
});
toolbar.appendChild(Object.assign(document.createElement('div'), {className: 'sep'}));
['INPUT','OUTPUT'].forEach(t => {
  const b = document.createElement('button');
  b.textContent = '+ ' + CFG[t].label;
  b.onclick = () => {
    gate(t, 200 + Math.random() * 800, 1800 + Math.random() * 300);
    renderAll();
  };
  toolbar.appendChild(b);
});

const valEl = document.createElement('div');
valEl.className = 'val';
valEl.id = 'valueDisplay';
valEl.textContent = '0 (0x00)';
toolbar.appendChild(valEl);

/* ============================================================
   KEYPAD
   ============================================================ */
let currentA = 0;
let currentB = 0;
let target = 'A';
let pendingOp = 0;
let lastResult = 0;

function setSwitchState(id, v){
  const n = nodes.find(n => n.id === id);
  if(n){ n.state = v ? 1 : 0; }
}
function readLED(id){
  const n = nodes.find(n => n.id === id);
  return n ? (n.out[0] | 0) : 0;
}
function setByte(ids, val){
  for(let i=0;i<8;i++){
    setSwitchState(ids[i], (val >> i) & 1);
  }
}
function readByte(ids){
  let v = 0;
  for(let i=0;i<8;i++) v |= readLED(ids[i]) << i;
  return v & 255;
}
function setOpBits(op){
  setSwitchState(ALU.op[0], op & 1);
  setSwitchState(ALU.op[1], (op >> 1) & 1);
}

function refreshDisplay(){
  const el = document.getElementById('valueDisplay');
  if(!el) return;
  let v;
  if(target === 'A'){
    v = (pendingOp === 0 && currentB === 0) ? currentA : lastResult;
    if(v === 0 && currentA === 0) v = currentA;
  } else {
    v = currentB;
  }
  const mode = target === 'A' ? 'A' : 'B';
  const opNames = ['+', '-', 'AND', 'OR'];
  const opTxt = pendingOp >= 0 && target === 'B' ? ' ' + opNames[pendingOp] : '';
  el.textContent = '[' + mode + opTxt + '] ' + String(v & 255) +
                   ' (0x' + (v & 255).toString(16).toUpperCase().padStart(2, '0') + ')';
}

function typeDigit(d){
  if(target === 'A'){
    currentA = ((currentA * 10) + d) & 255;
    setByte(ALU.A, currentA);
  } else {
    currentB = ((currentB * 10) + d) & 255;
    setByte(ALU.B, currentB);
  }
  simulate();
  refreshDisplay();
}

function pressOp(op){
  pendingOp = op;
  setOpBits(op);
  target = 'B';
  currentB = 0;
  setByte(ALU.B, 0);
  simulate();
  refreshDisplay();
}

function pressEq(){
  simulate();
  const r = readByte(ALU.result);
  lastResult = r;
  currentA = r;
  currentB = 0;
  target = 'A';
  pendingOp = 0;
  setOpBits(0);
  setByte(ALU.A, r);
  setByte(ALU.B, 0);
  simulate();
  refreshDisplay();
}

function pressClear(){
  currentA = 0;
  currentB = 0;
  target = 'A';
  pendingOp = 0;
  lastResult = 0;
  setByte(ALU.A, 0);
  setByte(ALU.B, 0);
  setOpBits(0);
  simulate();
  refreshDisplay();
}

const keypad = document.getElementById('keypad');
['7','8','9','4','5','6','1','2','3','0'].forEach(d => {
  const b = document.createElement('button');
  b.textContent = d;
  b.onclick = () => typeDigit(parseInt(d, 10));
  keypad.appendChild(b);
});
[
  {label: '+',   op: 0},
  {label: '-',   op: 1},
  {label: 'AND', op: 2},
  {label: 'OR',  op: 3}
].forEach(o => {
  const b = document.createElement('button');
  b.className = 'op';
  b.textContent = o.label;
  b.onclick = () => pressOp(o.op);
  keypad.appendChild(b);
});
const eqBtn = document.createElement('button');
eqBtn.className = 'eq';
eqBtn.textContent = '=';
eqBtn.onclick = pressEq;
keypad.appendChild(eqBtn);
const clrBtn = document.createElement('button');
clrBtn.className = 'clr';
clrBtn.textContent = 'C';
clrBtn.onclick = pressClear;
keypad.appendChild(clrBtn);

/* ============================================================
   INIT
   ============================================================ */
renderAll();
simulate();
refreshDisplay();
</script>
</body>
</html>
