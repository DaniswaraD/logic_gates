<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Logic Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;overflow:hidden;height:100%;font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none}
svg{display:block;width:100vw;height:100vh;background:#fff;touch-action:none;cursor:grab}
svg.drag{cursor:grabbing}
text{font-family:ui-monospace,Menlo,Consolas,monospace;user-select:none;pointer-events:none}
#tabs{position:fixed;top:10px;left:10px;z-index:10;display:flex;flex-wrap:wrap}
#tabs button{padding:8px 14px;background:#fff;border:2px solid #333;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;border-radius:0;outline:none}
#tabs button.active{background:#333;color:#fff}
#tabs button+button{border-left:none}
#help{position:fixed;bottom:10px;left:10px;font-size:11px;color:#888;z-index:10;max-width:55%}
#zoomCtrl{position:fixed;bottom:14px;right:14px;z-index:30;display:flex;flex-direction:column;gap:6px}
#zoomCtrl button{width:52px;height:52px;font-size:24px;font-weight:700;font-family:inherit;border:2px solid #333;background:#fff;cursor:pointer;border-radius:0;padding:0;line-height:1}
#zoomCtrl button:active{background:#333;color:#fff}
</style>
</head>
<body>
<div id="tabs">
<button data-p="1" class="active">Calculator</button>
<button data-p="2">Computer</button>
<button data-p="3">Pong</button>
</div>
<div id="zoomCtrl">
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <button id="zoomReset">⟲</button>
</div>
<div id="help">scroll = zoom · drag = pan · pinch = zoom (mobile) · dblclick = reset</div>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var svg=document.getElementById("s");
function E(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}

var gates=[],sws=[],leds=[],labels=[],wires=[];
var vp,lW,lG,lL,lU,lS;
var K0={v:0,x:0,y:0,virtual:true},K1={v:1,x:0,y:0,virtual:true};
var groupStack;
var currentProject=1;
var running=false;

function reset(){
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  gates=[];sws=[];leds=[];labels=[];wires=[];
  groupStack=[{x:30,y:80,rowH:0,maxW:20000,maxXUsed:0,maxYUsed:0,gStart:0,sStart:0,lStart:0}];
  vp=E("g",{});svg.appendChild(vp);
  lS=E("g",{});lW=E("g",{});lG=E("g",{});lL=E("g",{});lU=E("g",{});
  vp.appendChild(lS);vp.appendChild(lW);vp.appendChild(lG);vp.appendChild(lL);vp.appendChild(lU);
}

function curFrame(){return groupStack[groupStack.length-1];}
function framePlaceIn(f,w,h){
  if(f.x>0 && f.x+w>f.maxW){f.x=0;f.y+=f.rowH+20;f.rowH=0;}
  var p={x:f.x,y:f.y};
  f.x+=w+14;
  if(h>f.rowH)f.rowH=h;
  if(f.x-14>f.maxXUsed)f.maxXUsed=f.x-14;
  var yU=f.y+h;
  if(yU>f.maxYUsed)f.maxYUsed=yU;
  return p;
}
function place(w,h){return framePlaceIn(curFrame(),w,h);}
function beginGroup(maxW){
  groupStack.push({x:0,y:0,rowH:0,maxW:maxW||200,maxXUsed:0,maxYUsed:0,gStart:gates.length,sStart:sws.length,lStart:leds.length});
}
function endGroup(){
  var f=groupStack.pop();
  var w=f.maxXUsed||10,h=f.maxYUsed||10;
  var pos=framePlaceIn(curFrame(),w,h);
  var dx=pos.x,dy=pos.y,i;
  for(i=f.gStart;i<gates.length;i++){var g=gates[i];g.px+=dx;g.py+=dy;g.o.x+=dx;g.o.y+=dy;}
  for(i=f.sStart;i<sws.length;i++){var s=sws[i];s.px+=dx;s.py+=dy;s.o.x+=dx;s.o.y+=dy;}
  for(i=f.lStart;i<leds.length;i++){var l=leds[i];l.px+=dx;l.py+=dy;}
}
function forceNewRow(){
  var f=groupStack[0];
  if(!f)return;
  f.x=0;f.y+=f.rowH+40;f.rowH=0;
}
function section(title,maxW,fn){
  var g0=gates.length,s0=sws.length,l0=leds.length;
  beginGroup(maxW);fn();endGroup();
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  function ext(x1,y1,x2,y2){
    if(x1<minX)minX=x1;if(y1<minY)minY=y1;
    if(x2>maxX)maxX=x2;if(y2>maxY)maxY=y2;
  }
  for(var i=g0;i<gates.length;i++){var g=gates[i];ext(g.px-10,g.py-10,g.px+72,g.py+60);}
  for(var i=s0;i<sws.length;i++){var s=sws[i];ext(s.px-8,s.py-8,s.px+90,s.py+110);}
  for(var i=l0;i<leds.length;i++){var l=leds[i];var r=l.sz?l.sz*0.4:12;ext(l.px-r-4,l.py-r-4,l.px+r+4,l.py+r+4);}
  if(!isFinite(minX))return;
  var pad=18;
  var bx=minX-pad,by=minY-pad-24;
  var bw=(maxX-minX)+2*pad,bh=(maxY-minY)+2*pad+24;
  lS.appendChild(E("rect",{x:bx,y:by,width:bw,height:bh,fill:"#fafafa",stroke:"#b8b8b8","stroke-width":1.6,"stroke-dasharray":"5 3"}));
  var t=E("text",{x:bx+14,y:by+17,"font-size":12,"font-weight":700,fill:"#555","letter-spacing":"1.4px"});
  t.textContent=title;lS.appendChild(t);
}

function N(v,d){return{v:v|0,d:d|0};}
function mkGate(t,ins){
  var d=0;
  for(var i=0;i<ins.length;i++)d=Math.max(d,ins[i].d||0);
  d=d+1;
  var p=place(60,52);
  var g={t:t,i:ins,o:N(0,d),px:p.x,py:p.y};
  g.o.x=p.x+50;g.o.y=p.y+22;
  for(var i=0;i<ins.length;i++){
    var iy=ins.length===1?22:(i===0?16:34);
    if(ins[i].x!==undefined && !ins[i].virtual)wires.push({s:ins[i],g:g,py:iy});
  }
  gates.push(g);
  return g;
}
function AND(a,b){return mkGate("AND",[a,b]).o;}
function OR(a,b){return mkGate("OR",[a,b]).o;}
function NOT(a){return mkGate("NOT",[a]).o;}
function XOR(a,b){return mkGate("XOR",[a,b]).o;}

function LAT(init){
  var p=place(60,52);
  var g={t:"LAT",i:[K0,K0],o:N(0,1),px:p.x,py:p.y,prev:init|0,prevEn:0};
  g.o.x=p.x+50;g.o.y=p.y+22;
  gates.push(g);
  return g;
}
function setLat(g,d,en){
  g.i[0]=d;g.i[1]=en;
  if(d.x!==undefined && !d.virtual)wires.push({s:d,g:g,py:16});
  if(en.x!==undefined && !en.virtual)wires.push({s:en,g:g,py:34});
}

function sw(label_,group){
  var p=place(76,84);
  var s={v:0,o:N(0,0),px:p.x,py:p.y,label:label_||"",osc:false,group:group||null};
  s.o.x=p.x+66;s.o.y=p.y+30;
  sws.push(s);
  return s;
}
function osc(period,label_){
  var p=place(76,84);
  var s={v:0,o:N(0,0),px:p.x,py:p.y,label:label_||"OSC",osc:true,period:period|0||6,t:0};
  s.o.x=p.x+66;s.o.y=p.y+30;
  sws.push(s);
  return s;
}
function led(inputNode,color,label_,size){
  var sz=size||30;
  var p=place(sz,sz);
  var l={i:inputNode,v:0,c:color||"#39d353",px:p.x+sz/2,py:p.y+sz/2,label:label_||"",sz:sz};
  if(inputNode.x!==undefined && !inputNode.virtual)wires.push({s:inputNode,l:l});
  leds.push(l);
  return l;
}
function label(t,x,y,sz,col){labels.push({t:t,x:x|0,y:y|0,s:sz||12,c:col||"#333"});}

function gateBody(t){
  switch(t){
    case "AND":return "M0,0 L20,0 A26,26 0 0 1 20,52 L0,52 Z";
    case "OR":return "M0,0 Q18,0 42,26 Q18,52 0,52 Q16,26 0,0 Z";
    case "NOT":return "M0,0 L44,26 L0,52 Z";
    case "XOR":return "M6,0 Q24,0 48,26 Q24,52 6,52 Q22,26 6,0 Z";
  }
  return "M0,0 L50,0 L50,52 L0,52 Z";
}
function renderGate(g){
  var grp=E("g",{transform:"translate("+g.px+","+g.py+")"});
  grp.appendChild(E("path",{d:gateBody(g.t),fill:"#fff",stroke:"#222","stroke-width":2.2,"stroke-linejoin":"round"}));
  if(g.t==="XOR")grp.appendChild(E("path",{d:"M0,0 Q16,26 0,52",fill:"none",stroke:"#222","stroke-width":2.2}));
  if(g.t==="NOT")grp.appendChild(E("circle",{cx:49,cy:26,r:5,fill:"#fff",stroke:"#222","stroke-width":2.2}));
  var n=g.t==="NOT"?1:2;
  for(var i=0;i<n;i++){
    var y=n===1?26:(i===0?16:34);
    grp.appendChild(E("line",{x1:-10,y1:y,x2:0,y2:y,stroke:"#222","stroke-width":2.2}));
  }
  grp.appendChild(E("line",{x1:50,y1:26,x2:60,y2:26,stroke:"#222","stroke-width":2.2}));
  if(g.t==="LAT"){
    var t=E("text",{x:22,y:30,"text-anchor":"middle","font-size":11,fill:"#222","font-weight":700});
    t.textContent="D";grp.appendChild(t);
    grp.appendChild(E("path",{d:"M-6,38 L-6,46 L4,42 Z",fill:"none",stroke:"#222","stroke-width":1.6}));
  }
  lG.appendChild(grp);
}
function renderSwitch(s){
  var w=56,h=68;
  var grp=E("g",{transform:"translate("+s.px+","+s.py+")"});
  var box;
  if(s.osc){
    box=E("rect",{x:0,y:0,width:w,height:h,fill:"#dbe9ff",stroke:"#222","stroke-width":2.2});
    grp.appendChild(box);
    grp.appendChild(E("path",{d:"M10,34 H18 L22,18 L32,50 L36,34 H46",fill:"none",stroke:"#1a56db","stroke-width":2.2}));
  }else{
    box=E("rect",{x:0,y:0,width:w,height:h,fill:"#c8c8c8",stroke:"#222","stroke-width":2.2});
    grp.appendChild(box);
    var ky=s.v?7:h-30;
    var knob=E("rect",{x:7,y:ky,width:w-14,height:22,fill:"#fff",stroke:"#222","stroke-width":2.2});
    grp.appendChild(knob);
    s._knob=knob;
  }
  grp.appendChild(E("line",{x1:w,y1:34,x2:w+18,y2:34,stroke:"#222","stroke-width":2.2}));
  s._box=box;s._h=h;
  if(s.label){
    var t=E("text",{x:w/2,y:h+18,"text-anchor":"middle","font-size":12,"font-weight":700,fill:"#222"});
    t.textContent=s.label;grp.appendChild(t);
  }
  if(!s.osc){
    var hit=E("rect",{x:0,y:0,width:w,height:h,fill:"transparent",cursor:"pointer",class:"swhit"});
    grp.appendChild(hit);
    hit.addEventListener("click",function(ev){
      ev.stopPropagation();
      s.v=s.v?0:1;
      if(s.v && s.group){
        for(var q=0;q<sws.length;q++){
          if(sws[q]!==s && sws[q].group===s.group) sws[q].v=0;
        }
      }
    });
  }
  lU.appendChild(grp);
}
function renderLED(l){
  var sz=l.sz||30;
  var rOut=sz*0.4;
  var rIn=sz*0.22;
  var grp=E("g",{transform:"translate("+l.px+","+l.py+")"});
  if(sz<40)grp.appendChild(E("line",{x1:-rOut-4,y1:0,x2:-rOut,y2:0,stroke:"#222","stroke-width":2}));
  grp.appendChild(E("circle",{cx:0,cy:0,r:rOut,fill:"#fff",stroke:"#222","stroke-width":sz>40?2.8:2}));
  var inner=E("circle",{cx:0,cy:0,r:rIn,fill:"#e8e8e8"});
  grp.appendChild(inner);
  l._inner=inner;
  if(l.label){
    var t=E("text",{x:0,y:-rOut-6,"text-anchor":"middle","font-size":10,fill:"#555"});
    t.textContent=l.label;grp.appendChild(t);
  }
  lL.appendChild(grp);
}
function renderLabel(L){
  var t=E("text",{x:L.x,y:L.y,"font-size":L.s,fill:L.c,"font-weight":600,"text-anchor":"middle"});
  t.textContent=L.t;lU.appendChild(t);
}
function renderWire(){
  for(var i=0;i<wires.length;i++){
    var w=wires[i];
    var dx,dy;
    if(w.l){dx=w.l.px-(w.l.sz||30)*0.4-4;dy=w.l.py;}
    else{dx=w.g.px-10;dy=w.g.py+w.py;}
    var sx=w.s.x,sy=w.s.y;
    if(sx===undefined||sy===undefined)continue;
    var path;
    if(Math.abs(sy-dy)<3){path="M"+sx+","+sy+"H"+dx;}
    else{var mx=sx+(dx-sx)/2;path="M"+sx+","+sy+"H"+mx+"V"+dy+"H"+dx;}
    var line=E("path",{d:path,fill:"none",stroke:"#cfcfcf","stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round"});
    lW.appendChild(line);
    w._line=line;
    w._lastV=-1;
  }
}
function renderAll(){
  renderWire();
  for(var i=0;i<gates.length;i++)renderGate(gates[i]);
  for(var i=0;i<sws.length;i++)renderSwitch(sws[i]);
  for(var i=0;i<leds.length;i++)renderLED(leds[i]);
  for(var i=0;i<labels.length;i++)renderLabel(labels[i]);
}

function evalComb(g){
  var a=g.i[0]?g.i[0].v:0;
  var b=g.i[1]?g.i[1].v:0;
  switch(g.t){
    case "AND":return a&b;
    case "OR":return a|b;
    case "NOT":return a?0:1;
    case "XOR":return a^b;
  }
  return 0;
}
function simulate(){
  var iter,i,g;
  for(iter=0;iter<20;iter++){
    for(i=0;i<sws.length;i++)sws[i].o.v=sws[i].v;
    for(i=0;i<gates.length;i++){
      g=gates[i];
      if(g.t==="LAT"){g.o.v=g.prev;continue;}
      g.o.v=evalComb(g);
    }
  }
  var snap=[];
  for(i=0;i<gates.length;i++){
    g=gates[i];
    if(g.t!=="LAT")continue;
    snap.push({g:g,d:g.i[0]?g.i[0].v:0,en:g.i[1]?g.i[1].v:0});
  }
  for(i=0;i<snap.length;i++){
    var s=snap[i];
    if(s.en && !s.g.prevEn) s.g.prev=s.d;
    s.g.prevEn=s.en;
    s.g.o.v=s.g.prev;
  }
  for(iter=0;iter<10;iter++){
    for(i=0;i<sws.length;i++)sws[i].o.v=sws[i].v;
    for(i=0;i<gates.length;i++){
      g=gates[i];
      if(g.t==="LAT"){g.o.v=g.prev;continue;}
      g.o.v=evalComb(g);
    }
  }
}
function updateVisual(){
  for(var i=0;i<leds.length;i++){
    var l=leds[i];
    if(l.v!==l.i.v){l.v=l.i.v;l._inner.setAttribute("fill",l.v?l.c:"#e8e8e8");}
  }
  for(var i=0;i<sws.length;i++){
    var s=sws[i];
    if(s.osc)s._box.setAttribute("fill",s.v?"#8ab4ff":"#dbe9ff");
    else s._knob.setAttribute("y",s.v?7:s._h-30);
  }
  for(var i=0;i<wires.length;i++){
    var w=wires[i];
    if(!w._line)continue;
    var v=w.s.v;
    if(v!==w._lastV){
      w._lastV=v;
      w._line.setAttribute("stroke",v?"#111":"#cfcfcf");
      w._line.setAttribute("stroke-width",v?2.6:2);
    }
  }
}
function tickOsc(){
  if(!running)return;
  for(var i=0;i<sws.length;i++){
    var s=sws[i];
    if(s.osc){s.t++;if(s.t>=s.period){s.t=0;s.v=s.v?0:1;}}
  }
}

function fa(a,b,cin){
  beginGroup(150);
  var axb=XOR(a,b);
  var s=XOR(axb,cin);
  var ab=AND(a,b);
  var cc=AND(cin,axb);
  var co=OR(ab,cc);
  endGroup();
  return [s,co];
}
function add4(a,b,cin){
  var r0=fa(a[0],b[0],cin);
  var r1=fa(a[1],b[1],r0[1]);
  var r2=fa(a[2],b[2],r1[1]);
  var r3=fa(a[3],b[3],r2[1]);
  return {sum:[r0[0],r1[0],r2[0],r3[0]],cout:r3[1]};
}
function add8(a,b){
  var c=K0,s=[];
  for(var i=0;i<8;i++){var r=fa(a[i],b[i],c);s.push(r[0]);c=r[1];}
  return s;
}
function add3(a,b,cin){
  var c=cin,s=[];
  for(var k=0;k<3;k++){
    var t1=XOR(a[k],b[k]);
    var sk=XOR(t1,c);
    var g1=AND(a[k],b[k]);
    var g2=AND(t1,c);
    c=OR(g1,g2);
    s.push(sk);
  }
  return s;
}

/* ================= CALCULATOR ================= */
function buildCalc(){
  var A=[],B=[],SW_ADD,SW_SUB,SW_MUL,SW_DIV,outLeds=[];

  section("INPUT  (A · B · OPCODE)",1600,function(){
    beginGroup(500);for(var a=0;a<4;a++)A.push(sw("A"+(3-a)).o);endGroup();
    beginGroup(500);for(var b=0;b<4;b++)B.push(sw("B"+(3-b)).o);endGroup();
    beginGroup(420);
    SW_ADD=sw("ADD","op").o;
    SW_SUB=sw("SUB","op").o;
    SW_MUL=sw("MUL","op").o;
    SW_DIV=sw("DIV","op").o;
    endGroup();
  });

  section("OUTPUT  (R7 … R0)",600,function(){
    for(var o=7;o>=0;o--){
      var p=place(40,40);
      var ph={v:0,x:p.x-16,y:p.y,virtual:true};
      var l={i:ph,v:0,c:"#39d353",px:p.x+20,py:p.y+20,label:"R"+o,sz:40};
      wires.push({s:ph,l:l});leds.push(l);outLeds.push(l);
    }
  });

  forceNewRow();

  var addSub,subSign;
  section("ADD / SUB  —  ripple carry, B XOR SUB",900,function(){
    var bX=[];for(var q=0;q<4;q++)bX.push(XOR(B[q],SW_SUB));
    addSub=add4(A,bX,SW_SUB);
    subSign=AND(SW_SUB,NOT(addSub.cout));
  });

  forceNewRow();

  var mul;
  section("MULTIPLY  —  4×4 partial products",1500,function(){
    var pp=[];
    for(var i=0;i<4;i++){pp[i]=[];beginGroup(320);for(var j=0;j<4;j++)pp[i][j]=AND(A[j],B[i]);endGroup();}
    var acc=[pp[0][0],pp[0][1],pp[0][2],pp[0][3],K0,K0,K0,K0];
    beginGroup(1300);acc=add8(acc,[K0,pp[1][0],pp[1][1],pp[1][2],pp[1][3],K0,K0,K0]);endGroup();
    beginGroup(1300);acc=add8(acc,[K0,K0,pp[2][0],pp[2][1],pp[2][2],pp[2][3],K0,K0]);endGroup();
    beginGroup(1300);acc=add8(acc,[K0,K0,K0,pp[3][0],pp[3][1],pp[3][2],pp[3][3],K0]);endGroup();
    mul=acc;
  });

  forceNewRow();

  var divOut;
  section("DIVIDE  —  restoring, 4 rounds",1100,function(){
    function sub5(a,b){
      beginGroup(900);
      var nb=[];for(var m=0;m<5;m++)nb.push(NOT(b[m]));
      var c=K1,s=[];
      for(var m=0;m<5;m++){var r=fa(a[m],nb[m],c);s.push(r[0]);c=r[1];}
      var bo=NOT(c);endGroup();
      return {sum:s,borrow:bo};
    }
    var R=[K0,K0,K0,K0,K0],Q=[K0,K0,K0,K0];
    beginGroup(1000);
    for(var it=0;it<4;it++){
      beginGroup(950);
      var ai=A[3-it];
      var Rs=[ai,R[0],R[1],R[2],R[3]];
      var Bext=[B[0],B[1],B[2],B[3],K0];
      var d=sub5(Rs,Bext);
      var noBorrow=NOT(d.borrow);Q[3-it]=noBorrow;
      var Rn=[];
      for(var k=0;k<5;k++){
        var x=AND(Rs[k],d.borrow),y=AND(d.sum[k],noBorrow);
        Rn.push(OR(x,y));
      }
      R=Rn;endGroup();
    }
    endGroup();
    divOut=[Q[0],Q[1],Q[2],Q[3],R[0],R[1],R[2],R[3]];
  });

  forceNewRow();

  var finals=[];
  section("OUTPUT SELECT  —  opcode mux",1200,function(){
    var anyMulDiv=OR(SW_MUL,SW_DIV);
    var addActive=NOT(anyMulDiv);
    var addOut=[addSub.sum[0],addSub.sum[1],addSub.sum[2],addSub.sum[3],K0,K0,K0,subSign];
    for(var k=7;k>=0;k--){
      beginGroup(260);
      var a1=AND(addOut[k],addActive);
      var m1=AND(mul[k],SW_MUL);
      var d1=AND(divOut[k],SW_DIV);
      var o1=OR(a1,m1);
      finals.push(OR(o1,d1));
      endGroup();
    }
  });
  for(var k=0;k<8;k++){
    for(var i=0;i<wires.length;i++){
      if(wires[i].l===outLeds[k]){wires[i].s=finals[k];break;}
    }
    outLeds[k].i=finals[k];
  }
}

/* ================= COMPUTER  (semua input dari switch) ================= */
function buildComputer(){
  var dataSw=[];
  var WR,RD,RUN,CLR,A0,A1,CLK;
  var RUN_prev,CLR_prev,RUN_edge,CLR_edge;
  var addrDec=[],RAM=[],rdByte=[],disp=[];
  var anyWrite,anyRead;

  /* --- DATA BYTE: 8 switches (D7 .. D0 left to right) --- */
  section("DATA BYTE  (8 switch · D7…D0)",1400,function(){
    for(var b=7;b>=0;b--) dataSw[b]=sw("D"+b);
  });

  /* --- READ/WRITE + RUN + CLEAR --- */
  section("WRITE / READ / RUN / CLR",900,function(){
    WR=sw("WR","rw");
    RD=sw("RD","rw");
    RUN=sw("RUN");
    CLR=sw("CLR");
  });

  /* --- ADDRESS: 2 switches (00..11) --- */
  section("ADDRESS  (A1 A0)",700,function(){
    A1=sw("A1");
    A0=sw("A0");
  });

  /* --- CLK (untuk edge detection) --- */
  section("CLK  (edge trigger)",500,function(){
    CLK=osc(1,"CLK");
  });

  forceNewRow();

  /* --- EDGE DETECT --- */
  section("EDGE DETECT  (RUN · CLR pulse)",1200,function(){
    RUN_prev=LAT(0);
    CLR_prev=LAT(0);
    setLat(RUN_prev,RUN.o,CLK.o);
    setLat(CLR_prev,CLR.o,CLK.o);
    RUN_edge=AND(RUN.o,NOT(RUN_prev.o));
    CLR_edge=AND(CLR.o,NOT(CLR_prev.o));
  });

  /* --- ADDRESS DECODER 2→4 --- */
  section("ADDRESS DECODE  2→4",900,function(){
    var nA0=NOT(A0.o),nA1=NOT(A1.o);
    addrDec[0]=AND(nA1,nA0);
    addrDec[1]=AND(nA1,A0.o);
    addrDec[2]=AND(A1.o,nA0);
    addrDec[3]=AND(A1.o,A0.o);
  });

  forceNewRow();

  /* --- RAM: 4 × 8 D-latches --- */
  section("RAM  4 bytes × 8 bits  (32 D-latch)",3000,function(){
    var wrPulse=AND(RUN_edge,WR.o);
    var nClr=NOT(CLR_edge);
    for(var a=0;a<4;a++){
      beginGroup(700);
      RAM[a]=[];
      var wEn=AND(wrPulse,addrDec[a]);
      var en=OR(wEn,CLR_edge);
      for(var b=0;b<8;b++){
        beginGroup(74);
        var L=LAT(0);
        var d=AND(WR.o,dataSw[b].o);
        var dFinal=AND(d,nClr);
        setLat(L,dFinal,en);
        RAM[a][b]=L;
        endGroup();
      }
      endGroup();
    }
  });

  section("READ MUX  8 × 4→1",1300,function(){
    for(var b=0;b<8;b++){
      beginGroup(360);
      var acc=null;
      for(var a=0;a<4;a++){
        var t=AND(addrDec[a],RAM[a][b].o);
        acc=(acc===null)?t:OR(acc,t);
      }
      rdByte.push(acc);
      endGroup();
    }
  });

  forceNewRow();

  /* --- DISPLAY: 16 bits. A0 selects which half (0=high, 1=low) --- */
  section("DISPLAY REG  16 bit  (A0 pilih half)",2400,function(){
    var rdPulse=AND(RUN_edge,RD.o);
    var enHigh=AND(rdPulse,NOT(A0.o));
    var enLow=AND(rdPulse,A0.o);
    for(var b=0;b<16;b++){
      beginGroup(74);
      var L=LAT(0);
      var en=(b<8)?enLow:enHigh;
      var d=rdByte[b%8];
      setLat(L,d,en);
      disp[b]=L;
      endGroup();
    }
  });

  /* --- LED MATRIX 4×4 --- */
  section("LED MATRIX  4 × 4  (OUTPUT)",600,function(){
    for(var y=0;y<4;y++){
      beginGroup(500);
      for(var x=0;x<4;x++){
        var idx=15-(y*4+x);
        led(disp[idx].o,"#39d353","",95);
      }
      endGroup();
    }
  });

  /* --- Status LEDs kecil untuk mode & alamat --- */
  section("STATUS",700,function(){
    led(WR.o,"#39d353","W",30);
    led(RD.o,"#4a9eff","R",30);
    led(A1.o,"#ffb020","A1",30);
    led(A0.o,"#ffb020","A0",30);
    led(RUN.o,"#ff4d4d","RUN",30);
    led(CLR.o,"#ff4d4d","CLR",30);
  });
}

/* ================= PONG ================= */
function buildPong(){
  var CLK, P_UP, P_DN, O_UP, O_DN;
  var bx=[],by=[],py=[],oy=[],vx,vy;
  var p_up_prev,p_dn_prev,o_up_prev,o_dn_prev;
  var xd,yd,pyd,oyd,pyd1,oyd1;

  function dec3(bits){
    var out=[];
    var nb=[NOT(bits[0]),NOT(bits[1]),NOT(bits[2])];
    for(var v=0;v<8;v++){
      var b0=(v&1)?bits[0]:nb[0];
      var b1=(v&2)?bits[1]:nb[1];
      var b2=(v&4)?bits[2]:nb[2];
      out.push(AND(AND(b0,b1),b2));
    }
    return out;
  }

  section("CLOCK & CONTROLS  (4 tombol)",1200,function(){
    CLK=osc(6,"CLK");
    beginGroup(700);
    P_UP=sw("P ↑","pdir");
    P_DN=sw("P ↓","pdir");
    endGroup();
    beginGroup(700);
    O_UP=sw("O ↑","odir");
    O_DN=sw("O ↓","odir");
    endGroup();
  });

  forceNewRow();

  section("PADDLE CONTROLLERS  —  edge-detected step",2200,function(){
    p_up_prev=LAT(0);p_dn_prev=LAT(0);
    o_up_prev=LAT(0);o_dn_prev=LAT(0);
    setLat(p_up_prev,P_UP.o,CLK.o);
    setLat(p_dn_prev,P_DN.o,CLK.o);
    setLat(o_up_prev,O_UP.o,CLK.o);
    setLat(o_dn_prev,O_DN.o,CLK.o);
    var p_up_rise=AND(P_UP.o,NOT(p_up_prev.o));
    var p_dn_rise=AND(P_DN.o,NOT(p_dn_prev.o));
    var o_up_rise=AND(O_UP.o,NOT(o_up_prev.o));
    var o_dn_rise=AND(O_DN.o,NOT(o_dn_prev.o));
    py=[LAT(0),LAT(0),LAT(0)];
    oy=[LAT(0),LAT(0),LAT(0)];
    var py_is0=AND(AND(NOT(py[0].o),NOT(py[1].o)),NOT(py[2].o));
    var py_is6=AND(AND(NOT(py[0].o),py[1].o),py[2].o);
    var oy_is0=AND(AND(NOT(oy[0].o),NOT(oy[1].o)),NOT(oy[2].o));
    var oy_is6=AND(AND(NOT(oy[0].o),oy[1].o),oy[2].o);
    var p_dec=AND(p_up_rise,NOT(py_is0));
    var p_inc=AND(p_dn_rise,NOT(py_is6));
    var o_dec=AND(o_up_rise,NOT(oy_is0));
    var o_inc=AND(o_dn_rise,NOT(oy_is6));
    var py_next=add3([py[0].o,py[1].o,py[2].o],[OR(p_dec,p_inc),p_dec,p_dec],K0);
    setLat(py[0],py_next[0],CLK.o);
    setLat(py[1],py_next[1],CLK.o);
    setLat(py[2],py_next[2],CLK.o);
    var oy_next=add3([oy[0].o,oy[1].o,oy[2].o],[OR(o_dec,o_inc),o_dec,o_dec],K0);
    setLat(oy[0],oy_next[0],CLK.o);
    setLat(oy[1],oy_next[1],CLK.o);
    setLat(oy[2],oy_next[2],CLK.o);
  });

  forceNewRow();

  section("BALL PHYSICS  —  3-bit adder, wall bounce",2200,function(){
    bx=[LAT(0),LAT(0),LAT(0)];
    by=[LAT(0),LAT(0),LAT(0)];
    vx=LAT(1);vy=LAT(1);
    var bx_is0=AND(AND(NOT(bx[0].o),NOT(bx[1].o)),NOT(bx[2].o));
    var bx_is7=AND(AND(bx[0].o,bx[1].o),bx[2].o);
    var vx_next=OR(AND(vx.o,NOT(bx_is7)),AND(NOT(vx.o),bx_is0));
    var by_is0=AND(AND(NOT(by[0].o),NOT(by[1].o)),NOT(by[2].o));
    var by_is7=AND(AND(by[0].o,by[1].o),by[2].o);
    var vy_next=OR(AND(vy.o,NOT(by_is7)),AND(NOT(vy.o),by_is0));
    var bx_next=add3([bx[0].o,bx[1].o,bx[2].o],[K1,NOT(vx.o),NOT(vx.o)],K0);
    var by_next=add3([by[0].o,by[1].o,by[2].o],[K1,NOT(vy.o),NOT(vy.o)],K0);
    setLat(vx,vx_next,CLK.o);
    setLat(vy,vy_next,CLK.o);
    setLat(bx[0],bx_next[0],CLK.o);
    setLat(bx[1],bx_next[1],CLK.o);
    setLat(bx[2],bx_next[2],CLK.o);
    setLat(by[0],by_next[0],CLK.o);
    setLat(by[1],by_next[1],CLK.o);
    setLat(by[2],by_next[2],CLK.o);
  });

  forceNewRow();

  section("DECODERS  3→8  (ball · paddle rows)",3000,function(){
    xd=dec3([bx[0].o,bx[1].o,bx[2].o]);
    yd=dec3([by[0].o,by[1].o,by[2].o]);
    pyd=dec3([py[0].o,py[1].o,py[2].o]);
    oyd=dec3([oy[0].o,oy[1].o,oy[2].o]);
    pyd1=dec3(add3([py[0].o,py[1].o,py[2].o],[K1,K0,K0],K0));
    oyd1=dec3(add3([oy[0].o,oy[1].o,oy[2].o],[K1,K0,K0],K0));
  });

  forceNewRow();

  section("LED MATRIX  8 × 8  (OUTPUT)",600,function(){
    for(var row=0;row<8;row++){
      beginGroup(500);
      for(var col=0;col<8;col++){
        var ball=AND(xd[col],yd[row]);
        var on;
        if(col===0) on=OR(ball,OR(pyd[row],pyd1[row]));
        else if(col===7) on=OR(ball,OR(oyd[row],oyd1[row]));
        else on=ball;
        led(on,"#39d353","",40);
      }
      endGroup();
    }
  });
}

function computeBoundsNoLabels(){
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  function ext(x1,y1,x2,y2){
    if(x1<minX)minX=x1;if(y1<minY)minY=y1;
    if(x2>maxX)maxX=x2;if(y2>maxY)maxY=y2;
  }
  for(var i=0;i<gates.length;i++){var g=gates[i];ext(g.px-10,g.py-10,g.px+72,g.py+60);}
  for(var i=0;i<sws.length;i++){var s=sws[i];ext(s.px-8,s.py-8,s.px+90,s.py+110);}
  for(var i=0;i<leds.length;i++){var l=leds[i];var r=l.sz?l.sz*0.4:12;ext(l.px-r-4,l.py-r-4,l.px+r+4,l.py+r+4);}
  return {x1:minX,y1:minY,x2:maxX,y2:maxY};
}
function drawBoundingBox(){
  var b=computeBoundsNoLabels();
  if(!isFinite(b.x1))return;
  var pad=100;
  vp.insertBefore(E("rect",{
    x:b.x1-pad,y:b.y1-pad,
    width:(b.x2-b.x1)+pad*2,height:(b.y2-b.y1)+pad*2,
    fill:"none",stroke:"#222","stroke-width":4
  }),vp.firstChild);
}
function addProjectLabels(n){
  var b=computeBoundsNoLabels();
  if(!isFinite(b.x1))return;
  if(n===1){
    label("4-bit ALU   ·   ADD · SUB · MUL · DIV",(b.x1+b.x2)/2,b.y1-70,20,"#222");
  }else if(n===2){
    label("4-BYTE COMPUTER  —  switch-only input · 4×8 RAM · 4×4 LED",(b.x1+b.x2)/2,b.y1-70,20,"#222");
    label("WR=1 → set A1 A0 + D7..D0 → toggle RUN (naik) → byte tertulis ke RAM",(b.x1+b.x2)/2,b.y2+70,14,"#666");
    label("RD=1 → set A1 A0 → toggle RUN → RAM byte masuk display 4×4",(b.x1+b.x2)/2,b.y2+92,14,"#666");
    label("RUN harus di-toggle balik ke 0 sebelum aksi berikutnya",(b.x1+b.x2)/2,b.y2+114,13,"#888");
  }else{
    label("PONG   ·   4 tombol arah  ·  LED matrix 8×8",(b.x1+b.x2)/2,b.y1-70,20,"#222");
    label("P ↑ / P ↓ = paddle kiri  ·  O ↑ / O ↓ = paddle kanan",(b.x1+b.x2)/2,b.y2+70,14,"#666");
  }
}
function loadProject(n){
  reset();
  currentProject=n;
  if(n===1)buildCalc();else if(n===2)buildComputer();else buildPong();
  addProjectLabels(n);
  renderAll();
  drawBoundingBox();
  simulate();
  updateVisual();
}

/* ================= VIEWPORT ================= */
var view={x:0,y:0,k:1};
var MIN_K=0.003, MAX_K=25;
function applyView(){vp.setAttribute("transform","translate("+view.x+","+view.y+") scale("+view.k+")");}
function setZoomAt(nk,cx,cy){
  nk=Math.min(MAX_K,Math.max(MIN_K,nk));
  var s=nk/view.k;
  view.x=cx-(cx-view.x)*s;
  view.y=cy-(cy-view.y)*s;
  view.k=nk;
  applyView();
}
function zoomAtCenter(f){
  var r=svg.getBoundingClientRect();
  setZoomAt(view.k*f,r.width/2,r.height/2);
}
svg.addEventListener("wheel",function(e){
  e.preventDefault();
  var r=svg.getBoundingClientRect();
  setZoomAt(view.k*(e.deltaY<0?1.12:1/1.12),e.clientX-r.left,e.clientY-r.top);
},{passive:false});

var pointers={},panStart=null,pinchStart=null,mode=null;
svg.addEventListener("pointerdown",function(e){
  if(e.target.classList&&e.target.classList.contains("swhit"))return;
  if(e.button!==undefined&&e.button!==0&&e.pointerType==="mouse")return;
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  try{svg.setPointerCapture(e.pointerId);}catch(err){}
  var ids=Object.keys(pointers);
  if(ids.length===1){
    mode="pan";
    panStart={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y,moved:false};
    svg.classList.add("drag");
  }else if(ids.length===2){
    mode="pinch";
    var p0=pointers[ids[0]],p1=pointers[ids[1]];
    pinchStart={d:Math.hypot(p0.x-p1.x,p0.y-p1.y),cx:(p0.x+p1.x)/2,cy:(p0.y+p1.y)/2,k:view.k,x:view.x,y:view.y};
    panStart=null;
  }
});
svg.addEventListener("pointermove",function(e){
  if(!pointers[e.pointerId])return;
  pointers[e.pointerId].x=e.clientX;pointers[e.pointerId].y=e.clientY;
  if(mode==="pinch"){
    var ids=Object.keys(pointers);
    if(ids.length<2)return;
    var p0=pointers[ids[0]],p1=pointers[ids[1]];
    var d=Math.hypot(p0.x-p1.x,p0.y-p1.y);
    var cx=(p0.x+p1.x)/2,cy=(p0.y+p1.y)/2;
    var r=svg.getBoundingClientRect();
    var factor=d/pinchStart.d;
    var nk=Math.min(MAX_K,Math.max(MIN_K,pinchStart.k*factor));
    var s=nk/pinchStart.k;
    var mx=pinchStart.cx-r.left,my=pinchStart.cy-r.top;
    var nmx=cx-r.left,nmy=cy-r.top;
    view.x=nmx-(mx-pinchStart.x)*s;
    view.y=nmy-(my-pinchStart.y)*s;
    view.k=nk;applyView();
  }else if(mode==="pan"&&panStart){
    var dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;
    if(Math.abs(dx)>3||Math.abs(dy)>3)panStart.moved=true;
    if(panStart.moved){view.x=panStart.ox+dx;view.y=panStart.oy+dy;applyView();}
  }
});
function endPointer(e){
  delete pointers[e.pointerId];
  var ids=Object.keys(pointers);
  if(ids.length===0){mode=null;panStart=null;pinchStart=null;svg.classList.remove("drag");}
  else if(ids.length===1){
    mode="pan";
    var id=ids[0];
    panStart={x:pointers[id].x,y:pointers[id].y,ox:view.x,oy:view.y,moved:false};
    pinchStart=null;
  }
}
svg.addEventListener("pointerup",endPointer);
svg.addEventListener("pointercancel",endPointer);
svg.addEventListener("pointerleave",function(e){if(pointers[e.pointerId])endPointer(e);});
svg.addEventListener("dblclick",function(){view.x=0;view.y=0;view.k=1;applyView();});

document.getElementById("zoomIn").addEventListener("click",function(){zoomAtCenter(1.3);});
document.getElementById("zoomOut").addEventListener("click",function(){zoomAtCenter(1/1.3);});
document.getElementById("zoomReset").addEventListener("click",function(){view.x=0;view.y=0;view.k=1;applyView();});

var tabs=document.querySelectorAll("#tabs button");
for(var ti=0;ti<tabs.length;ti++){
  tabs[ti].addEventListener("click",function(){
    for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("active");
    this.classList.add("active");
    running=false;
    loadProject(parseInt(this.getAttribute("data-p")));
  });
}

loadProject(1);
running=true;
setInterval(function(){
  tickOsc();
  simulate();
  updateVisual();
},50);
})();
</script>
