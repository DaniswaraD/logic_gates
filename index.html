    for(var i=0;i<gL;i++){var g=gates[i];var a=g.i[0]?g.i[0].v:0;var b=g.i[1]?g.i[1].v:0;var t=g.t;var nv;

function routeWires(){
var STEP=2,buckets={},list=[],i,w;
for(i=0;i<wires.length;i++){w=wires[i];delete w.mx;if(w.s.x===undefined)continue;
if(w.l){w.ex=w.l.px-(w.l.sz||22)*0.4-2;w.ey=w.l.py;}
else if(w.g&&w.g.px!==undefined){w.ex=w.g.px-6;w.ey=w.g.py+w.py;}else{continue;}
if(Math.abs(w.s.y-w.ey)<3)continue;list.push(w);}
list.sort(function(a,b){return Math.abs(b.ey-b.s.y)-Math.abs(a.ey-a.s.y);});
for(i=0;i<list.length;i++){w=list[i];var y1=Math.min(w.s.y,w.ey)-1,y2=Math.max(w.s.y,w.ey)+1;
var ideal=w.s.x+(w.ex-w.s.x)/2,base=Math.round(ideal/STEP),pick=null;
for(var d=0;d<400&&pick===null;d++){for(var sg=(d===0?1:-1);sg<=1&&pick===null;sg+=2){
var key=base+sg*d,arr=buckets[key],ok=true;
if(arr)for(var m=0;m<arr.length;m++){var o=arr[m];if(o.n!==w.s&&o.a<y2&&o.b>y1){ok=false;break;}}
if(ok)pick=key;}}
if(pick===null)pick=base;(buckets[pick]||(buckets[pick]=[])).push({a:y1,b:y2,n:w.s});w.mx=pick*STEP;}}

try{svg.setPointerCapture(e.pointerId);}catch(err){}
var ids=Object.keys(ptrs);
if(ids.length===1){mode="pan";panS={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y,moved:false};svg.classList.add("drag");}
else if(ids.length===2){mode="pinch";var p0=ptrs[ids[0]],p1=ptrs[ids[1]];pinchS={d:Math.hypot(p0.x-p1.x,p0.y-p1.y),cx:(p0.x+p1.x)/2,cy:(p0.y+p1.y)/2,k:view.k,x:view.x,y:view.y};panS=null;}});
svg.addEventListener("pointermove",function(e){
if(!ptrs[e.pointerId])return;
ptrs[e.pointerId].x=e.clientX;ptrs[e.pointerId].y=e.clientY;
if(mode==="pinch"){var ids=Object.keys(ptrs);if(ids.length<2)return;
var p0=ptrs[ids[0]],p1=ptrs[ids[1]];var d=Math.hypot(p0.x-p1.x,p0.y-p1.y);var cx=(p0.x+p1.x)/2,cy=(p0.y+p1.y)/2;
var r=svg.getBoundingClientRect();var f=d/pinchS.d;var nk=Math.min(MAX_K,Math.max(MIN_K,pinchS.k*f));var s=nk/pinchS.k;
var mx=pinchS.cx-r.left,my=pinchS.cy-r.top;var nmx=cx-r.left,nmy=cy-r.top;
view.x=nmx-(mx-pinchS.x)*s;view.y=nmy-(my-pinchS.y)*s;view.k=nk;applyView();}
else if(mode==="pan"&&panS){var dx=e.clientX-panS.x,dy=e.clientY-panS.y;
if(Math.abs(dx)>3||Math.abs(dy)>3)panS.moved=true;
if(panS.moved){view.x=panS.ox+dx;view.y=panS.oy+dy;applyView();}}});
function endPtr(e){delete ptrs[e.pointerId];var ids=Object.keys(ptrs);
if(ids.length===0){mode=null;panS=null;pinchS=null;svg.classList.remove("drag");}
else if(ids.length===1){mode="pan";var id=ids[0];panS={x:ptrs[id].x,y:ptrs[id].y,ox:view.x,oy:view.y,moved:false};pinchS=null;}}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("pointerleave",function(e){if(ptrs[e.pointerId])endPtr(e);});
svg.addEventListener("dblclick",function(e){e.preventDefault();fitScreen();});
document.getElementById("zoomIn").addEventListener("click",function(){zoomC(1.3);});
document.getElementById("zoomOut").addEventListener("click",function(){zoomC(1/1.3);});
document.getElementById("zoomReset").addEventListener("click",function(){fitView();});

var statPC=document.getElementById("statPC"),statOP=document.getElementById("statOP"),statCLK=document.getElementById("statCLK"),statCUR=document.getElementById("statCUR");
loadProject();
setInterval(function(){
try{
tickOsc();simulate();gCLKCount++;
if(core.ptr){var pc=0;for(var i=0;i<PTR_BITS;i++)if(core.ptr[i]&&core.ptr[i].o.v)pc|=(1<<i);statPC.textContent=pc;}
if(core.qOpHi&&core.qOpLo){var hi=0,lo=0;for(var b=0;b<8;b++){if(core.qOpHi[b]&&core.qOpHi[b].v)hi|=(1<<b);if(core.qOpLo[b]&&core.qOpLo[b].v)lo|=(1<<b);}var op=(hi<<8)|lo;var h=op.toString(16).toUpperCase();while(h.length<4)h="0"+h;statOP.textContent=h+" "+(MNEM[op]||"?");}
statCLK.textContent=gCLKCount;
if(core.cCol&&core.cRow){var cc=core.cCol[0].o.v+core.cCol[1].o.v*2+core.cCol[2].o.v*4;var rr=core.cRow[0].o.v+core.cRow[1].o.v*2;statCUR.textContent=cc+","+rr;}
}catch(e){showErr((e&&e.message)||String(e));}},100);
var lastR=0;
requestAnimationFrame(function loop(t){requestAnimationFrame(loop);if(t-lastR<33)return;lastR=t;try{renderFrame();}catch(e){showErr((e&&e.message)||String(e));}});
})();
</script>
