function dec6helper(bits){

lowOut.push(AND(AND(b0,b1),b2));
}
for(var v=0;v<8;v++){
var b3=(v&1)?bits[3]:high3[0];var b4=(v&2)?bits[4]:high3[1];var b5=(v&4)?bits[5]:high3[2];
highOut.push(AND(AND(b3,b4),b5));

}

var NOOP_INSTR=[0x00,0x00,0x00,0x00];

function writeRamByte(arr,addr,val){for(var b=0;b<8;b++)arr[addr][b].prev=(val>>b)&1;}

function clearMemory(){
var i,b;
for(i=0;i<RAM_SIZE;i++)for(b=0;b<8;b++){core.RAM[i][b].prev=0;core.TAGS[i][b].prev=0;}
for(var s=0;s<8;s++){for(b=0;b<6;b++)core.slots[s].addr[b].prev=0;core.slots[s].valid.prev=0;}
if(core.ptr)for(i=0;i<3;i++){core.ptr[i].prev=0;core.ptr[i].prevEn=0;}
if(core.delayReg)for(i=0;i<4;i++){core.delayReg[i].prev=0;core.delayReg[i].prevEn=0;}
if(core.sxBits)for(i=0;i<5;i++){core.sxBits[i].prev=0;core.sxBits[i].prevEn=0;}
if(core.syBits)for(i=0;i<4;i++){core.syBits[i].prev=0;core.syBits[i].prevEn=0;}
if(core.sprVis){core.sprVis.prev=0;core.sprVis.prevEn=0;}
}
function loadProgram(program){
clearMemory();
var padded=(program||[]).slice(0,QUEUE_SLOTS);
while(padded.length<QUEUE_SLOTS)padded.push(NOOP_INSTR.slice());
var addr=QUEUE_START;
for(var i=0;i<QUEUE_SLOTS;i++){
var ins=padded[i];
writeRamByte(core.RAM,addr,ins[0]&0xFF);
writeRamByte(core.RAM,addr+1,ins[1]&0xFF);
writeRamByte(core.RAM,addr+2,ins[2]&0xFF);
writeRamByte(core.RAM,addr+3,ins[3]&0x3F);
for(var b=0;b<6;b++)core.slots[i].addr[b].prev=(addr>>b)&1;
core.slots[i].valid.prev=1;
addr+=4;
}
}

function routeWires(){
var STEP=2,buckets={},list=[],i,w;
for(i=0;i<wires.length;i++){
w=wires[i];delete w.mx;
if(w.s.x===undefined)continue;
if(w.l){w.ex=w.l.px-(w.l.sz||22)*0.4-2;w.ey=w.l.py;}
else{w.ex=w.g.px-6;w.ey=w.g.py+w.py;}
if(Math.abs(w.s.y-w.ey)<3)continue;
list.push(w);
}
list.sort(function(a,b){return Math.abs(b.ey-b.s.y)-Math.abs(a.ey-a.s.y);});
for(i=0;i<list.length;i++){
w=list[i];
var y1=Math.min(w.s.y,w.ey)-1,y2=Math.max(w.s.y,w.ey)+1;
var ideal=w.s.x+(w.ex-w.s.x)/2,base=Math.round(ideal/STEP),pick=null;
for(var d=0;d<400&&pick===null;d++){
for(var sg=(d===0?1:-1);sg<=1&&pick===null;sg+=2){
var key=base+sg*d,arr=buckets[key],ok=true;
if(arr)for(var m=0;m<arr.length;m++){var o=arr[m];if(o.n!==w.s&&o.a<y2&&o.b>y1){ok=false;break;}}
if(ok)pick=key;
}
}
if(pick===null)pick=base;
(buckets[pick]||(buckets[pick]=[])).push({a:y1,b:y2,n:w.s});
w.mx=pick*STEP;
}
}
function relayout43(){
var GX=22,GY=26,M=60,TOP=110,RATIO=16/9,CG=150,RG=55;
var secs=sectionsData,n=secs.length,i,k,maxW=0,totW=0,idx={};
if(!n)return null;
for(i=0;i<n;i++){idx[secs[i].title]=i;if(secs[i].w>maxW)maxW=secs[i].w;totW+=secs[i].w+GX;}
var fixed=[],isFixed={},y=0,inW=0;
var INP=["INPUT · OPCODE (8)","INPUT · DATA (8)","INPUT · TAG (8)","INPUT · ADDR (6)","INPUT · ACTION","INPUT · JOYSTICK","INPUT · CLK",
"QUEUE · ADDR (6)","QUEUE · ORDER (6)","QUEUE · ACTION","QUEUE · QCLK"];
for(k=0;k<INP.length;k++){
var a=idx[INP[k]];
if(a===undefined)continue;
fixed.push({i:a,x:0,y:y});
y+=secs[a].h+RG;
if(secs[a].w>inW)inW=secs[a].w;
}
var x0=inW+CG;
var sc=idx["SCREEN · GRID"];
var rv=idx["OUTPUT · RAM VIEW"];
var qv=idx["OUTPUT · QUEUE VIS"];
var qo=idx["OUTPUT · QUEUE OUT"];
if(sc!==undefined){
fixed.push({i:sc,x:x0,y:0});
var x1=x0+secs[sc].w+CG;
var yAcc=0;
if(rv!==undefined){fixed.push({i:rv,x:x1,y:yAcc});yAcc+=secs[rv].h+GY;}
if(qv!==undefined){fixed.push({i:qv,x:x1,y:yAcc});yAcc+=secs[qv].h+GY;}
if(qo!==undefined){fixed.push({i:qo,x:x1,y:yAcc});}
}
for(k=0;k<fixed.length;k++)isFixed[fixed[k].i]=1;
function pack(Wp){
var placed=[],pos=[],usedW=0,usedH=0,j,c,rr;
for(j=0;j<fixed.length;j++){var f=fixed[j],q=secs[f.i];placed.push({x:f.x,y:f.y,w:q.w,h:q.h});pos[f.i]={x:f.x,y:f.y};if(f.x+q.w>usedW)usedW=f.x+q.w;if(f.y+q.h>usedH)usedH=f.y+q.h;}
for(j=0;j<n;j++){
if(isFixed[j])continue;
var s=secs[j],cand=[0],bx=0,by=Infinity;
for(k=0;k<placed.length;k++){cand.push(placed[k].x);cand.push(placed[k].x+placed[k].w+GX);}
for(c=0;c<cand.length;c++){
var x=cand[c];
if(x>0&&x+s.w>Wp)continue;
var yy=0;
for(k=0;k<placed.length;k++){rr=placed[k];if(rr.x<x+s.w+GX&&rr.x+rr.w+GX>x){var yb=rr.y+rr.h+GY;if(yb>yy)yy=yb;}}
if(yy<by||(yy===by&&x<bx)){by=yy;bx=x;}
}
placed.push({x:bx,y:by,w:s.w,h:s.h});pos[j]={x:bx,y:by};
if(bx+s.w>usedW)usedW=bx+s.w;if(by+s.h>usedH)usedH=by+s.h;
}
return {pos:pos,w:usedW,h:usedH};
}
function fit(p){
var wN=p.w+2*M,hN=p.h+TOP+M,W,H;
if(wN/hN<RATIO){H=hN;W=hN*RATIO;}else{W=wN;H=wN/RATIO;}
return {W:W,H:H};
}
var best=null,bestArea=Infinity;
for(var t=0;t<=30;t++){
var Wp=maxW*Math.pow(totW/maxW,t/30);
var p=pack(Wp),f2=fit(p),ar=f2.W*f2.H;
if(ar<bestArea){bestArea=ar;best={p:p,f:f2};}
}
for(i=0;i<n;i++){
var sc2=secs[i],nx=M+best.p.pos[i].x,ny=TOP+best.p.pos[i].y;
var dx=nx-sc2.x,dy=ny-sc2.y;
for(k=sc2.g0;k<sc2.g1;k++){var g=gates[k];g.px+=dx;g.py+=dy;g.o.x+=dx;g.o.y+=dy;}
for(k=sc2.s0;k<sc2.s1;k++){var q2=sws[k];q2.px+=dx;q2.py+=dy;q2.o.x+=dx;q2.o.y+=dy;}
for(k=sc2.l0;k<sc2.l1;k++){var l=leds[k];l.px+=dx;l.py+=dy;if(l.ph){l.ph.x=l.px-(l.sz||22)*0.4-2;l.ph.y=l.py;}}
sc2.x=nx;sc2.y=ny;
}
return {x:0,y:0,w:best.f.W,h:best.f.H};
}

function zoomAtCenter(f){var r=svg.getBoundingClientRect();setZoomAt(view.k*f,r.width/2,r.height/2);}
svg.addEventListener("wheel",function(e){
e.preventDefault();
var r=svg.getBoundingClientRect();
setZoomAt(view.k*(e.deltaY<0?1.12:1/1.12),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
var pointers={},panStart=null,pinchStart=null,mode=null;
svg.addEventListener("pointerdown",function(e){
if(e.target&&e.target.classList&&e.target.classList.contains("swhit"))return;
if(e.target&&e.target.parentNode&&e.target.parentNode.classList&&e.target.parentNode.classList.contains("swhit"))return;
if(e.button!==undefined&&e.button!==0&&e.pointerType==="mouse")return;
pointers[e.pointerId]={x:e.clientX,y:e.clientY};
try{svg.setPointerCapture(e.pointerId);}catch(err){}
var ids=Object.keys(pointers);
if(ids.length===1){mode="pan";panStart={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y,moved:false};svg.classList.add("drag");}
else if(ids.length===2){
mode="pinch";
var p0=pointers[ids[0]],p1=pointers[ids[1]];
pinchStart={d:Math.hypot(p0.x-p1.x,p0.y-p1.y),cx:(p0.x+p1.x)/2,cy:(p0.y+p1.y)/2,k:view.k,x:view.x,y:view.y};
panStart=null;
}
});
svg.addEventListener("pointermove",function(e){
if(!pointers[e.pointerId])return;
pointers[e.pointerId].x=e.clientX;pointers[e.pointerId].y=e.clientY;
if(mode==="pinch"){
var ids=Object.keys(pointers);
if(ids.length<2)return;
var p0=pointers[ids[0]],p1=pointers[ids[1]];
var d=Math.hypot(p0.x-p1.x,p0.y-p1.y);
var cx=(p0.x+p1.x)/2,cy=(p0.y+p1.y)/2;
var r=svg.getBoundingClientRect();
var factor=d/pinchStart.d;
var nk=Math.min(MAX_K,Math.max(MIN_K,pinchStart.k*factor));
var s=nk/pinchStart.k;
var mx=pinchStart.cx-r.left,my=pinchStart.cy-r.top;
var nmx=cx-r.left,nmy=cy-r.top;
view.x=nmx-(mx-pinchStart.x)*s;view.y=nmy-(my-pinchStart.y)*s;view.k=nk;applyView();
}else if(mode==="pan"&&panStart){
var dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;
if(Math.abs(dx)>3||Math.abs(dy)>3)panStart.moved=true;
if(panStart.moved){view.x=panStart.ox+dx;view.y=panStart.oy+dy;applyView();}
}
});
function endPointer(e){
delete pointers[e.pointerId];
var ids=Object.keys(pointers);
if(ids.length===0){mode=null;panStart=null;pinchStart=null;svg.classList.remove("drag");}
else if(ids.length===1){mode="pan";var id=ids[0];panStart={x:pointers[id].x,y:pointers[id].y,ox:view.x,oy:view.y,moved:false};pinchStart=null;}
}
svg.addEventListener("pointerup",endPointer);
svg.addEventListener("pointercancel",endPointer);
svg.addEventListener("pointerleave",function(e){if(pointers[e.pointerId])endPointer(e);});
svg.addEventListener("dblclick",function(){view.x=0;view.y=0;view.k=1;applyView();});
document.getElementById("zoomIn").addEventListener("click",function(){zoomAtCenter(1.3);});
document.getElementById("zoomOut").addEventListener("click",function(){zoomAtCenter(1/1.3);});
document.getElementById("zoomReset").addEventListener("click",function(){view.x=0;view.y=0;view.k=1;applyView();});
var cheatEl=document.getElementById("cheat");
var cheatMin=document.getElementById("cheatMin");
document.getElementById("cheatBar").addEventListener("click",function(){
cheatEl.classList.toggle("min");
cheatMin.textContent=cheatEl.classList.contains("min")?"+":"−";
});
loadProject();
setInterval(function(){tickOsc();simulate();},80);
requestAnimationFrame(function loop(){renderFrame();requestAnimationFrame(loop);});
})();
</script>
</body>
</html>
